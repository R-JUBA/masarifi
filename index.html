<title>مصاريفي</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#111827;--muted:#6b7280;--primary:#0f766e;--primary-hover:#115e59;--line:#e5e7eb;--danger:#e11d48;--green:#059669;--shadow:0 8px 24px -12px rgba(15,23,42,.18);--radius:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;outline:none}
button{border:0;border-radius:12px;padding:12px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;transition:all .2s}
button:active{transform:scale(.97)}
.wrap{max-width:680px;margin:auto;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero{background:linear-gradient(135deg,#0f172a,#0f766e);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-radius:0 0 28px 28px;box-shadow:0 4px 12px rgba(15,118,110,.25)}
.top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top-nav h1{margin:0;font-size:20px;font-weight:800}
.btn-nav{background:rgba(255,255,255,.2);color:#fff;padding:8px 16px;border-radius:12px;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(4px)}
.btn-nav:active{background:rgba(255,255,255,.3)}
.hero p{margin:0 0 16px;font-size:14px;opacity:.9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.balance,.card{padding:14px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);margin:10px 0;border:1px solid var(--line)}
.balance{background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer;transition:transform .15s}
.balance:active{transform:scale(.98)}
.balance strong{display:block;font-size:24px;margin-top:4px;font-weight:800}
.field{margin:8px 0}
.grid>.field{margin:0}
.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:4px;font-weight:600}
.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);transition:border-color .2s}
.field input:focus,.field select:focus{border-color:var(--primary);background:var(--card)}
h2{font-size:18px;margin:0 0 10px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;gap:8px}
.muted{font-size:13px;color:var(--muted)}
.green{color:var(--green)}
.red{color:var(--danger)}
.danger{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}
.danger:active{background:#fca5a5;color:#fff}
.secondary{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:16px 0;font-size:14px}
.search-bar{display:flex;gap:8px;margin-bottom:8px}
.search-bar input{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.search-bar select{width:120px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.filter-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.filter-row select{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.filter-row input[type="date"]{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-width:0;font-size:13px}
.expense-item{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.02)}
.expense-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.expense-title{font-weight:700;font-size:15px}
.expense-note{font-size:13px;color:var(--muted);margin-top:2px}
.expense-amount{font-weight:800;font-size:16px;color:var(--danger);direction:ltr}
.expense-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:10px}
.expense-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.expense-actions{display:flex;gap:6px}
.expense-actions button{padding:6px 12px;font-size:12px;border-radius:8px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--primary);border-radius:4px;transition:width .3s}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-content{background:var(--bg);width:90%;max-width:500px;max-height:85vh;border-radius:24px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,.2);display:flex;flex-direction:column;transform:translateY(20px);transition:transform .3s}
.modal-overlay.active .modal-content{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h2{margin:0}
.close-modal{background:none;color:var(--text);font-size:24px;padding:0}
.drag-list{overflow-y:auto;flex:1;padding-bottom:10px;display:flex;flex-direction:column;gap:8px}
.drag-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background-color .2s,transform .15s;touch-action:pan-y}
.drag-item:active{background-color:#f8fafc}
body.dark .drag-item:active{background-color:#0f172a}
.drag-item.dragging-ready{touch-action:none}
.drag-handle{cursor:grab;padding:4px 6px 4px 10px;color:var(--muted);font-size:18px;line-height:1;touch-action:none;display:inline-flex;align-items:center;pointer-events:auto}
.drag-handle:active{cursor:grabbing;color:var(--primary)}
.drag-clone{position:fixed;margin:0;opacity:.96;box-shadow:0 18px 35px rgba(15,23,42,.28);z-index:9999;background-color:var(--card);border:2px solid var(--primary);border-radius:14px;transform:scale(1.03);pointer-events:none;transition:transform .1s ease,box-shadow .1s ease;direction:rtl}
body.dark .drag-clone{box-shadow:0 18px 35px rgba(0,0,0,.55)}
.drag-placeholder{border:2px dashed var(--primary);background:rgba(15,118,110,.08);border-radius:12px;margin:0;flex-shrink:0;transition:all .15s ease}
body.dark .drag-placeholder{background:rgba(15,118,110,.2)}
.drag-item .cat-name{font-weight:600;display:flex;align-items:center;gap:8px}
.drag-item .cat-actions{display:flex;gap:6px}
.drag-item .cat-actions button{padding:4px 10px;font-size:12px;border-radius:8px}
.sub-cat-item{padding-right:32px;background:var(--bg)}
body.dark{--bg:#0b1220;--card:#131c2e;--text:#f1f5f9;--muted:#94a3b8;--line:#243049;--shadow:0 4px 6px -1px rgba(0,0,0,0.2)}
body.dark .hero{background:linear-gradient(135deg,#020617,#115e59)}
body.dark .field input,body.dark .field select,body.dark .search-bar input,body.dark .search-bar select,body.dark .filter-row select,body.dark .filter-row input[type="date"]{background:#0f172a}

body.dark .secondary{background:#334155;color:#fff;border-color:#475569}
body.dark .balance{background:rgba(0,0,0,.2);border-color:rgba(255,255,255,.1)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(120px);background:#1e293b;color:#fff;padding:10px 14px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 10px 25px -3px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:1100;opacity:0;display:flex;align-items:center;justify-content:center;gap:8px;max-width:calc(100vw - 32px)}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
#pa{display:none}
@media print{@page{margin:12mm}body.printing{background:#fff!important}body.printing>*:not(#pa){display:none!important}body.printing #pa{display:block;color:#000;background:#fff}#pa table{width:100%;border-collapse:collapse;margin:12px 0}#pa td,#pa th{border:1px solid #999;padding:6px;text-align:start}}
.i{width:1.15em;height:1.15em;vertical-align:-.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block}
@font-face{font-family:Cairo;src:url(cairo.woff2) format("woff2");font-weight:200 1000;font-display:swap}
.hero p{margin:0 0 8px!important}
.hero .balance{margin:4px 0 6px}
.balance.sm{padding:8px 12px;margin:3px 0!important}.balance.sm strong{font-size:17px}
.tile{background:var(--card);border:1px solid var(--line);color:var(--text);padding:18px 8px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--shadow)}
.tile .ic{width:46px;height:46px;border-radius:15px;background:color-mix(in srgb,var(--primary) 13%,transparent);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:22px}
.tile .ic .i{width:24px;height:24px}
#bnav{position:fixed;bottom:0;left:0;right:0;z-index:500;display:flex;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px -10px rgba(15,23,42,.25)}
#bnav button{flex:1;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:6px 0;border-radius:12px}
#bnav button.on{color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent)}
#bnav .i{width:22px;height:22px}
.cat-dot{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.expense-item{gap:6px;padding:12px 14px}
.expense-bottom{border-top:0;padding-top:0}
.expense-actions button{padding:3px 10px;font-size:11px;border-radius:8px;opacity:.85}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#view>*{animation:vin .25s ease}
@media (prefers-reduced-motion:reduce){#view>*{animation:none}}
@media print{#bnav{display:none!important}}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;padding:0 26px;font-size:17px;font-weight:800;gap:8px}.grp>summary::-webkit-details-marker{display:none}.grp>summary::after{content:"▾";transition:transform .2s;opacity:.6;position:absolute;inset-inline-end:0;top:50%;margin-top:-.6em;line-height:1.2}.grp[open]>summary::after{transform:rotate(180deg)}
</style>
</head>

<script>
/* مخزن احتياطي IndexedDB + تحميل التطبيق بعد قراءته */
(function(){
  var DBN='masarifi-db',ST='kv';
  var KEYS=['masarifi.expenses.v8','masarifi.wallets.v8','masarifi.debts.v8','masarifi.cats.v2','masarifi.settings.v1','masarifi.recurring.v1','masarifi.moves.v1','masarifi.goals.v1'];
  var I=window.__idb={db:null,err:'',lastOk:0,lastT:0,pending:null,busy:false,dead:false,frozen:false,restored:false};
  window.__SNAP=null;window.__seq=0;
  function lsSeq(){try{return +localStorage.getItem('masarifi.seq')||0}catch(e){return 0}}
  function lsData(){var d={},n=0;try{KEYS.forEach(function(k){var v=localStorage.getItem(k);if(v!==null){d[k]=v;n++}})}catch(e){}return n?d:null}
  function flush(){
    if(I.busy||!I.pending||!I.db)return;
    I.busy=true;var p=I.pending;I.pending=null;
    try{
      var tx=I.db.transaction(ST,'readwrite');
      tx.objectStore(ST).put({seq:p.seq,t:Date.now(),data:p.data},'snap');
      tx.oncomplete=function(){I.busy=false;I.lastOk=p.seq;I.lastT=Date.now();I.err='';flush()};
      tx.onerror=tx.onabort=function(){if(!I.busy)return;I.busy=false;I.err=(tx.error&&tx.error.name)||'write';flush()};
    }catch(e){I.busy=false;I.err='write'}
  }
  I.save=function(seq,data){
    if(!I.db)return false;
    if(I.frozen)return true;
    I.pending={seq:seq,data:data};flush();return true;
  };
  I.clear=function(){
    I.frozen=true;I.pending=null;
    return new Promise(function(res,rej){
      if(!I.db)return res();
      try{
        var tx=I.db.transaction(ST,'readwrite');
        tx.objectStore(ST).clear();
        tx.oncomplete=function(){res()};
        tx.onerror=tx.onabort=function(){rej(tx.error||new Error('clear'))};
      }catch(e){rej(e)}
    });
  };
  var loadP=new Promise(function(resolve){
    var done=false;function fin(){if(!done){done=true;resolve()}}
    setTimeout(function(){if(!done){I.dead=true;I.err='timeout';fin()}},2500);
    try{
      if(!window.indexedDB){I.err='unsupported';return fin()}
      var r=indexedDB.open(DBN,1);
      r.onupgradeneeded=function(){try{r.result.createObjectStore(ST)}catch(e){}};
      r.onerror=function(){I.err='open';fin()};
      r.onblocked=function(){I.err='blocked'};
      r.onsuccess=function(){
        var db=r.result;
        if(I.dead){try{db.close()}catch(e){}return}
        db.onversionchange=function(){try{db.close()}catch(e){}I.db=null};
        var g;
        try{g=db.transaction(ST,'readonly').objectStore(ST).get('snap')}catch(e){I.err='read';fin();return}
        g.onsuccess=function(){
          if(I.dead){try{db.close()}catch(e){}return}
          var snap=g.result,ls=lsSeq();
          I.db=db;
          if(snap&&snap.data&&snap.seq>ls){
            window.__SNAP=snap.data;window.__seq=snap.seq;I.restored=true;I.lastOk=snap.seq;I.lastT=snap.t||0;
          }else{
            window.__seq=Math.max(ls,snap&&snap.seq||0);
            var d=lsData();
            if(d&&(!snap||snap.seq<ls)){window.__seq=Math.max(ls,1);I.save(window.__seq,d)}
            else if(snap){I.lastOk=snap.seq;I.lastT=snap.t||0}
          }
          fin();
        };
        g.onerror=function(){I.err='read';fin()};
      };
    }catch(e){I.err='open';fin()}
  });
  var domP=new Promise(function(r){if(document.readyState!=='loading')r();else document.addEventListener('DOMContentLoaded',function(){r()})});
  Promise.all([loadP,domP]).then(function(){
    var sc=document.createElement('script');
    sc.textContent=document.getElementById('mainsrc').textContent;
    document.body.appendChild(sc);
  });
})();
</script>
<script type="text/plain" id="mainsrc">
'use strict';
const CURRENCY='د.ج'; const VER=70; 
const K={e:'masarifi.expenses.v8', w:'masarifi.wallets.v8', d:'masarifi.debts.v8', c:'masarifi.customCats.v1', c2:'masarifi.cats.v2', s:'masarifi.settings.v1', r:'masarifi.recurring.v1', m:'masarifi.moves.v1', g:'masarifi.goals.v1'};
const defaults=[['food','طعام','🍔','#f97316'],['transport','مواصلات','🚌','#3b82f6'],['bills','فواتير','🧾','#64748b'],['health','صحة','💊','#ef4444'],['education','تعليم','📚','#8b5cf6'],['fun','ترفيه','🎮','#ec4899'],['shopping','تسوق','🛍️','#14b8a6'],['other','أخرى','📦','#a3a3a3']].map(([id,name,emoji,color])=>({id,name,emoji,color,parent:null}));

const round=n=>Math.round((Number(n)||0)*100)/100, fmt=n=>round(n).toLocaleString(LOC[LANG],{maximumFractionDigits:2})+' '+CUR_[LANG], id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const safeCol=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#0f766e';
const localISO=(d=new Date())=>{let x=new Date(d.getTime());x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};

function offerUndo(message, restoreFn){
  let t = document.querySelector('#toast');
  clearTimeout(_mt);clearTimeout(_undoTimer);
  t.innerHTML = `<span style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(T(message))}</span><button onclick="doUndo()" style="background:rgba(34,197,94,.95);color:#fff;border:0;padding:6px 12px;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px;flex-shrink:0;">↶ ${esc(T('تراجع'))}</button><button onclick="dismissUndo()" aria-label="إغلاق" style="background:transparent;color:rgba(255,255,255,.7);border:0;padding:2px 6px;cursor:pointer;font-size:14px;line-height:1;flex-shrink:0;">✕</button>`;
  t.classList.add('on');
  undoAction = restoreFn;
  _undoTimer = setTimeout(()=>{t.classList.remove('on');setTimeout(()=>{ if(!t.querySelector('button[onclick*="doUndo"]')) t.innerHTML=''; },300);undoAction=null;},7000);
}
window.doUndo = function(){
  if(!undoAction) return;
  const fn = undoAction;
  undoAction = null;
  clearTimeout(_undoTimer);clearTimeout(_mt);
  const t = document.querySelector('#toast');
  t.classList.remove('on');
  setTimeout(()=>{ if(!t.querySelector('button[onclick*="doUndo"]')) t.innerHTML=''; },300);
  fn();
};
window.dismissUndo = function(){
  clearTimeout(_undoTimer);
  const t = document.querySelector('#toast');
  t.classList.remove('on');
  setTimeout(()=>{ if(!t.querySelector('button[onclick*="doUndo"]')) t.innerHTML=''; },300);
  undoAction = null;
};

function autoArch(){
  if(!cfg.autoArchive) return 0;
  const cur=pKey(today());let n=0;
  expenses.forEach(x=>{const k=pKey(String(x.date||'').slice(0,10));if(!x.archived&&k&&k<cur){x.archived=true;n++}});
  if(n) save();
  return n;
}

function applyRecurring(){
  let changed=false;
  const now=new Date(),cur=now.getFullYear()*12+now.getMonth(),dom=now.getDate();
  recurring.forEach(r=>{
    const amt=round(r.amount);
    if(!(wOk(r.wallet)&&amt>0))return;
    const m=/^(\d{4})-(\d{2})$/.exec(r.lastApplied||'');
    let start=m?(+m[1])*12+(+m[2]-1)+1:cur;
    start=Math.max(start,cur-11);
    for(let k=start;k<=cur;k++){
      const y=Math.floor(k/12),mo=k%12,dim=new Date(y,mo+1,0).getDate();
      const td=Math.min(Math.max(1,Number(r.dayOfMonth)||1),dim);
      if(k===cur&&dom<td)break;
      if(!cfg.allowNeg&&wallets[r.wallet]<amt)break;
      const ym=y+'-'+String(mo+1).padStart(2,'0');
      expenses.push({id:id(),amount:amt,wallet:r.wallet,category:r.category,date:ym+'-'+String(td).padStart(2,'0'),note:r.note||'مصروف متكرر'});
      wallets[r.wallet]=round(wallets[r.wallet]-amt);
      r.lastApplied=ym;changed=true;
    }
  });
  if(changed) {
    save();
    if ('Notification' in window && Notification.permission === 'granted') {
      try { new Notification('📒 مصاريفي', { body: 'تم تسجيل مصاريف متكررة جديدة تلقائياً.' }); } catch(e) {}
    }
  }
}

    return new Date(Date.UTC(y, m-1, 1))
      .toLocaleDateString(LOC[LANG], { month:'long', year:'numeric', timeZone:'UTC' });

  }

function buildCatOptions(selectedId) {
  let html = '';
  let mains = cats.filter(c => !c.parent);
  mains.forEach(m => {
    let subs = cats.filter(c => c.parent === m.id);
    if (subs.length > 0) {
      html += `<optgroup label="${esc(m.emoji+' '+T(m.name))}">`;
      html += `<option value="${esc(m.id)}" ${m.id===selectedId?'selected':''}>${esc(m.emoji+' '+T(m.name))} (${esc(T('رئيسي'))})</option>`;
      subs.forEach(s => {
        html += `<option value="${esc(s.id)}" ${s.id===selectedId?'selected':''}>&nbsp;&nbsp;↳ ${esc(s.emoji+' '+T(s.name))}</option>`;
      });
    } else {
      html += `<option value="${esc(m.id)}" ${m.id===selectedId?'selected':''}>${esc(m.emoji+' '+T(m.name))}</option>`;
    }
    if (subs.length > 0) html += `</optgroup>`;
  });
  cats.filter(c => c.parent && !cats.find(m => m.id === c.parent)).forEach(orphan => {
    html += `<option value="${esc(orphan.id)}" ${orphan.id===selectedId?'selected':''}>${esc(orphan.emoji+' '+T(orphan.name))}</option>`;
  });
  if(selectedId&&!cats.some(c=>c.id===selectedId))html+=`<option value="${esc(selectedId)}" selected>📦 ${esc(T('غير مصنف'))}</option>`;
  return html;
}

function buildFilterCatOptions(selectedId) {
  let html = `<option value="all" ${selectedId==='all'?'selected':''}>${esc(T('كل الفئات'))}</option>`;
  let mains = cats.filter(c => !c.parent);
  mains.forEach(m => {
    let subs = cats.filter(c => c.parent === m.id);
    if (subs.length > 0) {
      html += `<optgroup label="${esc(m.emoji+' '+T(m.name))}">`;
      html += `<option value="${esc(m.id)}" ${m.id===selectedId?'selected':''}>${esc(m.emoji+' '+T(m.name))} (${esc(T('رئيسي'))})</option>`;
      subs.forEach(s => {
        html += `<option value="${esc(s.id)}" ${s.id===selectedId?'selected':''}>&nbsp;&nbsp;↳ ${esc(s.emoji+' '+T(s.name))}</option>`;

    } else {
      html += `<option value="${esc(m.id)}" ${m.id===selectedId?'selected':''}>${esc(m.emoji+' '+T(m.name))}</option>`;
    }
  });
  return html;
}

let listLimit=50;
function dayLabel(d){
  if(d===today())return'اليوم';
  if(d===localISO(new Date(Date.now()-864e5)))return'أمس';
  try{const x=new Date(String(d).slice(0,10)+'T00:00:00Z');if(!isNaN(x))return x.toLocaleDateString(LOC[LANG],{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'})}catch{}
  return d;
}
function expListHTML(){
  const v=visible().slice().reverse().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0), shown=v.slice(0,listLimit);
  if(!v.length) return '<div class="empty">لا توجد مصاريف مطابقة.</div>';
  let last='',out='';
  shown.forEach(e=>{if(e.date!==last){last=e.date;out+=`<div class="muted" style="margin:14px 4px 8px;font-weight:700">${esc(dayLabel(e.date))}</div>`}out+=expRow(e)});
  return out+(v.length>shown.length?`<button class="secondary" id="moreExp" style="width:100%;">عرض المزيد (${v.length-shown.length})</button>`:'');
}

function prevMonth(m){let[y,mo]=m.split('-').map(Number);mo--;if(!mo){mo=12;y--}return y+'-'+p2(mo)}

function donutHTML(rows,tot){
  let R=70,C=2*Math.PI*R,acc=0,seg=rows.map(r=>{let len=r.v/tot*C,col=safeCol(r.c.color),x=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${col}" stroke-width="28" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"/>`;acc+=len;return x}).join('');
  return `<svg viewBox="0 0 200 200" style="width:100%;max-width:220px;display:block;margin:auto">${seg}<text x="100" y="94" text-anchor="middle" font-size="11" fill="var(--muted)">المجموع</text><text x="100" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="currentColor">${fmt(tot)}</text></svg>`+rows.map(r=>`<div class="row" style="padding:8px 0; border-bottom:1px solid var(--line);"><span><i style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${safeCol(r.c.color)};margin-left:8px;"></i>${esc(r.c.emoji+' '+r.c.name)}</span><div><span class="muted" style="margin-left:8px;">${Math.round(r.v/tot*100)}%</span><b>${fmt(r.v)}</b></div></div>`).join('')
}

function trendHTML(){
  const mk=pKey(today()),[st,en]=pBounds(mk),t0=ts(today());
  const N=Math.max(1,Math.min(Math.round((en-st)/DAY)+1,Math.round((t0-st)/DAY)+1));
  let d=Array(N).fill(0);
  expenses.forEach(e=>{if(!e.date||mOf(e)!==mk)return;let i=Math.round((ts(String(e.date).slice(0,10))-st)/DAY);if(i>=0&&i<N)d[i]+=Number(e.amount)});
  let a=0,c=d.map(v=>{a+=v;return round(a)});
  let mx=Math.max(...c,1),u=Math.pow(10,Math.floor(Math.log10(mx))),nm=Math.ceil(mx/u)*u,W=320,H=170,L=42,Rr=20,TP=12,B=26,X=i=>N>1?L+i*(W-L-Rr)/(N-1):L+(W-L-Rr)/2,Y=v=>TP+(1-v/nm)*(H-TP-B),pts=c.map((v,i)=>X(i)+','+Y(v)),
  grid=[0,1,2,3,4].map(k=>{let v=nm*k/4;return `<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="var(--muted)">${round(v).toLocaleString(LOC[LANG])}</text>`}).join(''),
  step=Math.max(1,Math.ceil(N/6)),
  lb=c.map((v,i)=>{if(i%step)return'';let dt=new Date(st+i*DAY);return `<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--muted)">${p2(dt.getUTCDate())}/${p2(dt.getUTCMonth()+1)}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;direction:ltr;margin-top:10px;">${grid}<polygon points="${X(0)},${Y(0)} ${pts.join(' ')} ${X(N-1)},${Y(0)}" fill="var(--primary)" opacity="0.1"/><polyline points="${pts.join(' ')}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round"/>${N<=16?c.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--primary)"/>`).join(''):`<circle cx="${X(N-1)}" cy="${Y(c[N-1])}" r="3.5" fill="var(--primary)"/>`}${lb}</svg>`
}

function weekHTML(){
  const t0=ts(today()),dow=new Date(t0).getUTCDay(),ws=t0-dow*DAY;
  const cur=Array(7).fill(0),prev=Array(7).fill(0),bc={};
  expenses.forEach(e=>{if(!e.date)return;const i=Math.round((ts(String(e.date).slice(0,10))-ws)/DAY),a=Number(e.amount);if(i>=0&&i<7){cur[i]+=a;bc[e.category]=(bc[e.category]||0)+a}else if(i>=-7&&i<0)prev[i+7]+=a});
  const tot=round(cur.reduce((a,b)=>a+b,0)),pt=round(prev.slice(0,dow+1).reduce((a,b)=>a+b,0)),avg=round(tot/(dow+1)),ch=pt>0?Math.round((tot-pt)/pt*100):null;
  const badge=ch===null?'<span class="muted">—</span>':`<b class="${ch>0?'red':'green'}">${ch>0?'▲':'▼'} ${Math.abs(ch)}%</b>`;
  const top=Object.entries(bc).sort((a,b)=>b[1]-a[1])[0],mx=Math.max(...cur,1),W=320,H=130,bw=30,gap=(W-7*bw)/8;
  const bars=cur.map((v,i)=>{const h=Math.round(v/mx*80),x=gap+i*(bw+gap),y=100-h,dt=new Date(ws+i*DAY);return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,v>0?2:0)}" rx="5" fill="var(--primary)" opacity="${i===dow?1:(i>dow?.15:.5)}"/>${v>0?`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" font-size="9" fill="var(--text)">${round(v).toLocaleString(LOC[LANG])}</text>`:''}<text x="${x+bw/2}" y="118" text-anchor="middle" font-size="10" fill="var(--muted)">${dt.toLocaleDateString(LOC[LANG],{weekday:'short',timeZone:'UTC'})}</text>`}).join('');
  return `<details class="card grp" open><summary>🗓️ ملخص الأسبوع</summary><div style="margin-top:10px"><svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;direction:ltr">${bars}</svg><div class="row" style="margin-top:8px"><span>مصاريف هذا الأسبوع</span><b>${fmt(tot)}</b></div><div class="row"><span>المتوسط اليومي</span><b>${fmt(avg)}</b></div><div class="row"><span>مقارنة بنفس الأيام من الأسبوع الماضي</span>${badge}</div>${top?`<div class="row"><span>أعلى فئة هذا الأسبوع</span><b>${cat(top[0]).emoji} ${esc(cat(top[0]).name)} · ${fmt(top[1])}</b></div>`:''}</div></details>`;
}
function catTrendHTML(){
  const N=6,keys=[];let k=pKey(today());for(let i=0;i<N;i++){keys.unshift(k);k=prevMonth(k)}
  const by={};
  expenses.forEach(e=>{const i=keys.indexOf(mOf(e));if(i<0)return;(by[e.category]=by[e.category]||Array(N).fill(0))[i]+=Number(e.amount)});
  const rows=Object.entries(by).map(([c,a])=>({c,a:a.map(round),t:round(a.reduce((x,y)=>x+y,0))})).sort((x,y)=>y.t-x.t).slice(0,6);
  const body=rows.length?rows.map(r=>{const mx=Math.max(...r.a,1),l=r.a[N-1],p=r.a[N-2],ch=p>0?Math.round((l-p)/p*100):null,badge=ch===null?'':`<b class="${ch>0?'red':'green'}">${ch>0?'▲':'▼'} ${Math.abs(ch)}%</b>`,col=safeCol(cat(r.c).color);
    const svg=`<svg viewBox="0 0 84 34" style="width:84px;height:34px;flex:none;direction:ltr">${r.a.map((v,i)=>{const h=v>0?Math.max(2,Math.round(v/mx*30)):0;return `<rect x="${i*14+2}" y="${32-h}" width="10" height="${h}" rx="2" fill="${col}" opacity="${i===N-1?1:.45}"/>`}).join('')}</svg>`;
    return `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line);gap:10px"><div style="min-width:0;flex:1"><div style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cat(r.c).emoji} ${esc(cat(r.c).name)}</div><div class="muted" style="font-size:12px">${fmt(l)} ${badge}</div></div>${svg}</div>`}).join(''):'<div class="empty">لا توجد بيانات كافية</div>';
  return `<details class="card grp"><summary>📈 الفئات عبر الأشهر</summary><div style="margin-top:10px"><div class="muted" style="font-size:12px;margin-bottom:6px">آخر 6 فترات — الشريط الداكن هو الفترة الحالية</div>${body}</div></details>`;
}
function statView(){
  let ms=expenses.filter(e=>mOf(e)===smo()),tot=sum(ms),by={};ms.forEach(e=>by[e.category]=round((by[e.category]||0)+Number(e.amount)));
  let rows=Object.entries(by).map(([k,v])=>({c:cat(k),v})).sort((a,b)=>b.v-a.v),pt=cmpMonth?sum(expenses.filter(e=>mOf(e)===cmpMonth)):0,ch=pt>0?Math.round((tot-pt)/pt*100):null,
  badge=ch===null?(tot>0?'<span class="muted">جديد</span>':'<span class="muted">—</span>'):`<b class="${ch>0?'red':'green'}">${ch>0?'▲':'▼'} ${Math.abs(ch)}%</b>`;
  
  const isCurrentMonth = smo() === pKey(today());
  const [pst, pen] = pBounds(smo());
  const totalDays = Math.round((pen - pst) / DAY) + 1;
  const daysPassed = Math.min(totalDays, Math.max(1, Math.round((ts(today()) - pst) / DAY) + 1));
  let prediction = 0;
  if (isCurrentMonth && tot > 0) prediction = round(tot / daysPassed * totalDays);

  const currentY = new Date().getFullYear();
  const yearExp = expenses.filter(e => String(e.date||'').startsWith(String(currentY)));
  const yearTotal = sum(yearExp);
  const daysPassedInYear = Math.ceil((new Date() - new Date(currentY, 0, 1)) / 86400000) || 1;
  const dailyAvg = round(yearTotal / daysPassedInYear);

  const [mst, men] = pBounds(smo());
  const mStart = new Date(mst).toISOString().slice(0,10);
  const mEnd = new Date(men).toISOString().slice(0,10);
  const monthIncome = round(moves
    .filter(m => m.type === 'deposit' && String(m.date||'').slice(0,10) >= mStart && String(m.date||'').slice(0,10) <= mEnd)
    .reduce((t,m) => t + Number(m.amount), 0));
  const netBalance = round(monthIncome - tot);

  return backBtn()+`
  <details class="card grp" open><summary>📅 الفترة والتصدير</summary><div style="margin-top:10px">
    <div class="field"><label>اختر الفترة</label><input id="sm" type="month" value="${esc(smo())}"></div><div class="muted">الفترة: ${arMonth(smo())} (${pRange(smo())})</div>
    <div class="row" style="margin-top:16px; flex-wrap:wrap; gap:8px;">
      <button id="xpdf" style="flex:1;">📄 PDF</button>
      <button id="xls" class="secondary" style="flex:1;">📊 Excel</button>
      <button id="csv" class="secondary" style="flex:1;">📑 CSV</button>
    </div>
  </div></details>
  
  <details class="card grp" open><summary>💵 ملخص الفترة</summary><div style="margin-top:10px">
    <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px;">
      <div style="background:var(--bg); padding:10px; border-radius:10px; text-align:center;">
        <div class="muted" style="font-size:11px;">الدخل</div>
        <b style="font-size:14px; color:var(--green);">${fmt(monthIncome)}</b>
      </div>
      <div style="background:var(--bg); padding:10px; border-radius:10px; text-align:center;">
        <div class="muted" style="font-size:11px;">المصاريف</div>
        <b style="font-size:14px; color:var(--danger);">${fmt(tot)}</b>
      </div>
      <div style="background:var(--bg); padding:10px; border-radius:10px; text-align:center;">
        <div class="muted" style="font-size:11px;">الصافي</div>
        <b style="font-size:14px; color:${netBalance>=0?'var(--primary)':'var(--danger)'};">${fmt(netBalance)}</b>
      </div>
    </div>
    ${monthIncome === 0 ? '<div class="muted" style="font-size:11px; margin-top:8px;">لا يوجد دخل مسجل في هذه الفترة. أضف إيداعاً من المحافظ.</div>' : ''}
  </div></details>
  
  <details class="card grp"><summary>📅 إحصائيات سنة ${currentY}</summary><div style="margin-top:10px">
    <div class="grid" style="grid-template-columns:1fr 1fr; gap:10px;">
      <div style="background:var(--bg); padding:12px; border-radius:12px;"><div class="muted">إجمالي السنة</div><b style="font-size:16px;">${fmt(yearTotal)}</b></div>
      <div style="background:var(--bg); padding:12px; border-radius:12px;"><div class="muted">المتوسط اليومي</div><b style="font-size:16px;">${fmt(dailyAvg)}</b></div>
    </div>
    <div class="muted" style="font-size:12px; margin-top:10px;">بناءً على ${yearExp.length} عملية خلال ${daysPassedInYear} يوماً مضت.</div>
  </div></details>
  <details class="card grp"><summary>📊 توزيع المصاريف</summary><div style="margin-top:10px">${tot>0?donutHTML(rows,tot):'<div class="empty">لا توجد مصاريف</div>'}</div></details>
  <details class="card grp"><summary>🔮 توقعات نهاية الشهر</summary><div style="margin-top:10px">
    <div class="row">
      <span class="muted">بمعدل صرفك الحالي، ستنهي الشهر بـ:</span>
      <b style="font-size:18px; color:var(--primary);">${prediction>0 ? fmt(prediction) : '—'}</b>
    </div>
  </div></details>
  <details class="card grp"><summary>📈 اتجاه الإنفاق</summary><div style="margin-top:10px">${trendHTML()}</div></details>
  <details class="card grp"><summary>⚖️ مقارنة شهرية</summary><div style="margin-top:10px">
    <div class="field"><label>قارن مع شهر</label><input id="cm" type="month" value="${esc(cmpMonth)}"></div>
    ${cmpMonth?`<div class="muted" style="margin-bottom:8px;">الفترة: ${arMonth(cmpMonth)} (${pRange(cmpMonth)})</div>
    <div class="grid">
      <div style="background:var(--bg); padding:12px; border-radius:12px;"><div class="muted">الشهر المحدد</div><b style="font-size:16px;">${fmt(pt)}</b></div>
      <div style="background:var(--bg); padding:12px; border-radius:12px;"><div class="muted">الفترة المعروضة</div><b style="font-size:16px;">${fmt(tot)}</b></div>
    </div>
    <div class="row" style="margin-top:12px;"><span class="muted">نسبة التغيّر</span>${badge}</div>`:'<div class="muted">اختر شهراً لمقارنته بالفترة الحالية.</div>'}
  </div></details>`+weekHTML()+catTrendHTML();
}

const visible = () => {
  if(filterCat !== 'all' && !cats.some(c => c.id === filterCat)) filterCat = 'all';
  const ids = filterCat === 'all' ? null : [filterCat].concat(cats.filter(c => c.parent === filterCat).map(c => c.id));
  return expenses.filter(x => {
    if(x.archived) return false;
    if(ids && !ids.includes(x.category)) return false;
    if(filterWallet !== 'all' && x.wallet !== filterWallet) return false;
    const d = String(x.date||'').slice(0,10);
    if(filterDateFrom && d < filterDateFrom) return false;
    if(filterDateTo && d > filterDateTo) return false;
    if(searchQuery) {
      const q = searchQuery.toLowerCase();
      const c = cat(x.category);
      const text = (x.note || '') + ' ' + c.name + ' ' + T(c.name) + ' ' + x.amount;
      if(!text.toLowerCase().includes(q)) return false;
    }
    return true;
  });
};

function effBudgetFor(mk){
  let base = cfg.budget, roll = 0;
  if (cfg.rolloverBudget && base > 0) {
    let pm = prevMonth(mk);
    let pmSpent = sum(expenses.filter(e => pKey(e.date) === pm));
    if (base > pmSpent) roll = round(base - pmSpent);
  }
  return { base, roll, eff: round(base + roll) };
}

function budgetHTML(){

  let left = round(effBudget - sp);

  return `<details class="card grp" open><summary>📊 ملخص الميزانية</summary><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px">
    <div class="card" style="padding:12px; text-align:center; margin:0;"><div class="muted">المصاريف</div><b>${fmt(sp)}</b></div>

  <details class="card grp" open><summary>🎯 الميزانية الشهرية</summary><div style="margin-top:10px"><div class="muted" style="margin-bottom:12px;">الفترة الحالية: ${arMonth(mk)} (${pRange(mk)})</div>

  <div class="field"><label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; font-weight: 600; margin-top: 8px; padding: 10px; background: var(--card); border-radius: 12px; border: 1px solid var(--line);">
    <input type="checkbox" name="rollover" ${cfg.rolloverBudget?'checked':''} style="width: 22px; height: 22px; accent-color: var(--primary); margin: 0; cursor: pointer;">
    ترحيل المتبقي للشهر القادم
  </label></div>
  <div class="field"><label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; font-weight: 600; padding: 10px; background: var(--card); border-radius: 12px; border: 1px solid var(--line);">

}

function pKey(ds){let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(ds);if(!m)return'';let y=+m[1],mo=+m[2],d=+m[3],dim=new Date(Date.UTC(y,mo,0)).getUTCDate(),sd=Math.min(cfg.startDay||1,dim);if(d<sd){mo--;if(!mo){mo=12;y--}}return y+'-'+String(mo).padStart(2,'0')}
function pBounds(k){let[y,m]=k.split('-').map(Number),sd=(a,b)=>Math.min(cfg.startDay||1,new Date(Date.UTC(a,b,0)).getUTCDate()),ny=m==12?y+1:y,nm=m==12?1:m+1;return[Date.UTC(y,m-1,sd(y,m)),Date.UTC(ny,nm-1,sd(ny,nm))-864e5]}
function pRange(k){
  const[st,en]=pBounds(k);
  const f=t=>{let d=new Date(t);return String(d.getUTCDate()).padStart(2,'0')+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+d.getUTCFullYear()};
  if (LANG === 'ar') return f(st) + ' ← ' + f(en);
  return f(st) + ' → ' + f(en);
}

}
function checkSingleLimit(id){

}

function toggleAddCatForm(show) {
  let w = document.getElementById('addCatWrapper');
  if (show === undefined) {
    w.style.display = w.style.display === 'none' ? 'block' : 'none';
  } else {
    w.style.display = show ? 'block' : 'none';
  }
  if (w.style.display === 'block') {
    let opts = `<option value="">-- فئة رئيسية --</option>`;
    cats.filter(c => !c.parent).forEach(c => {
      opts += `<option value="${esc(c.id)}">${esc(c.emoji + ' ' + c.name)}</option>`;
    });
    const sel = document.querySelector('#cf select[name="parent"]');
    if (sel) sel.innerHTML = opts;
    tr(w);
  }
}

function buildParentSelectHTML(currentCat) {
  let opts = `<option value="" ${!currentCat.parent ? 'selected' : ''}>-- فئة رئيسية --</option>`;
  cats.filter(c => !c.parent && c.id !== currentCat.id).forEach(c => {
    opts += `<option value="${esc(c.id)}" ${currentCat.parent === c.id ? 'selected' : ''}>${esc(c.emoji + ' ' + c.name)}</option>`;
  });
  return `<div class="field"><label>الفئة الأم</label><select name="parent">${opts}</select></div>`;
}

function bindCatModal() {
  const list = document.getElementById('dragList');

  let cf = document.querySelector('#cf');
  if (cf) {
    cf.onsubmit = e => {
      e.preventDefault();
      let f = new FormData(cf), n = f.get('name').trim();

      cats.push({
        id: id(), name: n, emoji: f.get('emoji').trim() || '✨',
        color: safeCol(f.get('color')), limit: Math.max(0, round(f.get('limit'))),
        parent: f.get('parent') || null
      });
      save(); renderCatModalList(); cf.reset(); toggleAddCatForm(false); msg('تمت إضافة الفئة');
    };
  }
  
  document.querySelectorAll('.emoji-pick-btn').forEach(b => {
    b.onclick = (e) => { e.preventDefault(); document.getElementById('emojiModal').classList.add('active'); };
  });

  list.querySelectorAll('.edit-cat-btn').forEach(b => b.onclick = e => {
    e.stopPropagation(); editCat = b.dataset.id; renderCatModalList();
  });
  list.querySelectorAll('.cancel-edit-cat').forEach(b => b.onclick = e => {
    e.stopPropagation(); editCat = null; renderCatModalList();
  });
  list.querySelectorAll('.del-cat-btn').forEach(b => b.onclick = e => {
    e.stopPropagation();
    if (cats.length <= 1) return msg('يجب إبقاء فئة واحدة على الأقل');
    let c = cats.find(x => x.id === b.dataset.id);
    if (!c || !confirm('حذف فئة «' + c.name + '»؟ ستظهر مصاريفها السابقة كغير مصنفة.')) return;
    cats.filter(x => x.parent === c.id).forEach(x => x.parent = null);
    cats = cats.filter(x => x.id !== c.id);

  });
  list.querySelectorAll('.ecf').forEach(fm => fm.onsubmit = e => {

function handlePointerDown(e) {
  if (e.button && e.button !== 0) return;
  if (isDragging || pressTimer || e.isPrimary === false) return;
  const item = e.target.closest('.drag-item');
  if (!item || item.tagName === 'FORM' || e.target.closest('button') || e.target.closest('input') || e.target.closest('select')) return;

  const isHandle = !!e.target.closest('.drag-handle');
  startX = e.clientX;
  startY = e.clientY;
  currentPointerY = e.clientY;

  const pointerId = e.pointerId;
  const delay = isHandle ? 40 : 300;

  pressTimer = setTimeout(() => {
    pressTimer = null;
    startDrag(item, e, pointerId);
  }, delay);

  const checkMoveBeforeStart = ev => {
    if (!pressTimer) return;
    if (Math.abs(ev.clientX - startX) > 10 || Math.abs(ev.clientY - startY) > 10) {
      clearPendingPress();
    }
  };

  const clearPendingPress = () => {
    if (pressTimer) {
      clearTimeout(pressTimer);
      pressTimer = null;
    }
    document.removeEventListener('pointermove', checkMoveBeforeStart);
    document.removeEventListener('pointerup', clearPendingPress);
    document.removeEventListener('pointercancel', clearPendingPress);
  };

  document.addEventListener('pointermove', checkMoveBeforeStart);
  document.addEventListener('pointerup', clearPendingPress, { once: true });
  document.addEventListener('pointercancel', clearPendingPress, { once: true });
}

document.addEventListener('touchmove', e => {
  if (isDragging) e.preventDefault();
}, { passive: false });

function startDrag(item, e, pointerId) {
  if (isDragging) return;
  if (navigator.vibrate) navigator.vibrate(40);
  isDragging = true;
  dragItem = item;
  item.classList.add('dragging-ready');

  try { item.setPointerCapture(pointerId); } catch (_) {}

  const list = document.getElementById('dragList');
  const rect = item.getBoundingClientRect();

  hiddenSubItems = [];
  if (item.dataset.isMain === '1') {
    const mainId = item.dataset.id;
    list.querySelectorAll(`.sub-cat-item[data-parent="${CSS.escape(mainId)}"]`).forEach(sub => {
      sub.style.display = 'none';
      hiddenSubItems.push(sub);
    });
  }

  dragPlaceholder = document.createElement('div');
  dragPlaceholder.className = 'drag-placeholder';
  dragPlaceholder.style.height = `${rect.height}px`;
  dragPlaceholder.style.width = `${rect.width}px`;

  item.parentNode.insertBefore(dragPlaceholder, item);
  item.style.display = 'none';

  dragClone = item.cloneNode(true);
  dragClone.classList.add('drag-clone');
  dragClone.style.display = 'flex';
  dragClone.style.top = `${rect.top}px`;
  dragClone.style.left = `${rect.left}px`;
  dragClone.style.width = `${rect.width}px`;
  dragClone.style.height = `${rect.height}px`;
  document.body.appendChild(dragClone);

  dragClone.offsetY = startY - rect.top;
  dragClone.offsetX = startX - rect.left;

  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);

  startAutoScroll();
}

function onDragMove(e) {
  if (!isDragging || !dragClone) return;
  currentPointerY = e.clientY;
  dragClone.style.top = `${e.clientY - dragClone.offsetY}px`;
  dragClone.style.left = `${e.clientX - dragClone.offsetX}px`;
  updatePlaceholderPosition(e.clientX, e.clientY);
}

function updatePlaceholderPosition(clientX, clientY) {
  const list = document.getElementById('dragList');
  const listRect = list.getBoundingClientRect();
  const clampedX = Math.max(listRect.left + 20, Math.min(clientX, listRect.right - 20));
  const el = document.elementFromPoint(clampedX, clientY);
  const targetItem = el ? el.closest('.drag-item') : null;

  if (targetItem && targetItem !== dragItem && targetItem.tagName !== 'FORM' && targetItem.style.display !== 'none') {
    if (dragItem && dragItem.dataset.isMain === '1') {
      const gid = targetItem.dataset.isMain === '1' ? targetItem.dataset.id : targetItem.dataset.parent;
      const kids = Array.from(list.children).filter(x => x.dataset && x.dataset.parent === gid && x.style.display !== 'none');
      const first = Array.from(list.children).find(x => x.dataset && x.dataset.id === gid && x.dataset.isMain === '1');
      if (!first) return;
      const last = kids.length ? kids[kids.length - 1] : first;
      const gmid = (first.getBoundingClientRect().top + last.getBoundingClientRect().bottom) / 2;
      list.insertBefore(dragPlaceholder, clientY < gmid ? first : last.nextSibling);
      return;
    }
    const firstMain = Array.from(list.children).find(x => x.dataset && x.dataset.isMain === '1' && x.style.display !== 'none');
    const targetRect = targetItem.getBoundingClientRect();
    const targetMid = targetRect.top + targetRect.height / 2;
    if (clientY < targetMid) {
      if (firstMain && targetItem === firstMain) {
        list.insertBefore(dragPlaceholder, firstMain.nextSibling);
      } else {
        list.insertBefore(dragPlaceholder, targetItem);
      }
    } else {
      list.insertBefore(dragPlaceholder, targetItem.nextSibling);
    }
  }
}

function startAutoScroll() {
  const list = document.getElementById('dragList');
  const step = () => {
    if (!isDragging) return;
    const rect = list.getBoundingClientRect();
    const threshold = 45;
    const maxSpeed = 8;

    if (currentPointerY < rect.top + threshold) {
      list.scrollTop -= maxSpeed;
    } else if (currentPointerY > rect.bottom - threshold) {
      list.scrollTop += maxSpeed;
    }
    autoScrollRAF = requestAnimationFrame(step);
  };
  autoScrollRAF = requestAnimationFrame(step);
}

function onDragEnd() {
  if (!isDragging) return;
  isDragging = false;
  if (autoScrollRAF) cancelAnimationFrame(autoScrollRAF);

  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  document.removeEventListener('pointercancel', onDragEnd);

  if (dragClone) { dragClone.remove(); dragClone = null; }

  if (dragItem && dragPlaceholder && dragPlaceholder.parentNode) {
    dragItem.style.display = '';
    dragItem.classList.remove('dragging-ready');
    dragPlaceholder.parentNode.insertBefore(dragItem, dragPlaceholder);

    let refNode = dragItem.nextSibling;
    hiddenSubItems.forEach(sub => {
      sub.style.display = '';
      dragItem.parentNode.insertBefore(sub, refNode);
    });
    hiddenSubItems = [];
    dragPlaceholder.remove();
  }

  dragItem = null; dragPlaceholder = null;
  saveNewCatOrder();
}

function cancelActiveDrag() {
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  if (isDragging) onDragEnd();
  document.querySelectorAll('.drag-clone').forEach(x => x.remove());
}

function saveNewCatOrder() {
  const list = document.getElementById('dragList');
  const elements = Array.from(list.querySelectorAll('.drag-item'));
  const newCats = [];
  let currentMainId = null;

  elements.forEach(el => {
    const c = cats.find(x => x.id === el.dataset.id);
    if (!c) return;
    if (!c.parent) {
      currentMainId = c.id;
    } else if (currentMainId) {
      c.parent = currentMainId;
    }
    newCats.push(c);
  });

  if (newCats.length === cats.length) {
    cats = newCats;
    save();
    renderCatModalList();
  }
}
