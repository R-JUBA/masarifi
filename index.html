<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json"><title>مصاريفي</title><style>
:root{--teal:#0f766e;--mint:#14b8a6;--bg:#f1f5f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:#17212b}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:11px;background:var(--teal);color:white;font-weight:bold}.wrap{max-width:680px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#0f766e,#14b8a6);color:white;padding:calc(20px + env(safe-area-inset-top)) 14px 25px;border-radius:0 0 25px 25px}.hero h1{margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.balance,.card{padding:15px;border-radius:16px;background:white;margin:12px 0;box-shadow:0 4px 16px #0000000a}.balance{background:#ffffff22;border:1px solid #ffffff40;color:white}.balance strong{display:block;font-size:22px}.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap}.tabs .active{background:#115e59}.field{margin:10px 0}.field label{display:block;color:#64748b;font-size:13px;margin-bottom:4px}.field input,.field select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:12px;background:white}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.item{padding:12px 0;border-bottom:1px solid #e2e8f0}.muted{font-size:13px;color:#64748b}.green{color:#15803d}.red{color:#dc2626}.danger{background:#dc2626}.secondary{background:#e2e8f0;color:#17212b}.empty{text-align:center;color:#64748b;padding:18px}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#17212b;color:white;padding:12px;border-radius:12px;display:none}.toast.on{display:block}
</style></head><body><header class="hero"><div class="wrap"><div class="row"><h1>📒 مصاريفي</h1><button id="settings">⚙️</button></div><p>إدارة أموالك ومصاريفك وديونك</p><div class="grid"><div class="balance">🏦 الحساب البنكي<strong id="bank">0</strong></div><div class="balance">💵 النقدية / الجيب<strong id="cash">0</strong></div></div></div></header><main class="wrap"><nav class="tabs"><button data-tab="expenses" class="active">المصاريف</button><button data-tab="wallets">المحافظ</button><button data-tab="debts">الديون</button><button data-tab="categories">الفئات</button><button data-tab="backup">النسخ الاحتياطي</button></nav><section id="view"></section></main><div class="toast" id="toast"></div>
<script>
'use strict';const CURRENCY='د.ج';const K={e:'masarifi.expenses.v8',w:'masarifi.wallets.v8',d:'masarifi.debts.v8',c:'masarifi.customCats.v1'};const defaults=[['food','طعام','🍔','#f97316'],['transport','مواصلات','🚌','#3b82f6'],['bills','فواتير','🧾','#64748b'],['health','صحة','💊','#ef4444'],['education','تعليم','📚','#8b5cf6'],['fun','ترفيه','🎮','#ec4899'],['shopping','تسوق','🛍️','#14b8a6'],['other','أخرى','📦','#a3a3a3']].map(([id,name,emoji,color])=>({id,name,emoji,color}));const round=n=>Math.round((Number(n)||0)*100)/100,fmt=n=>round(n).toLocaleString('ar-DZ',{maximumFractionDigits:2})+' '+CURRENCY,id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),today=()=>new Date().toISOString().slice(0,10);function read(k,d){try{let x=localStorage.getItem(k);return x===null?d:JSON.parse(x)}catch{return d}}let expenses=read(K.e,[]),wallets=read(K.w,{account:0,cash:0}),debts=read(K.d,[]),custom=read(K.c,[]),tab='expenses';function save(){try{localStorage.setItem(K.e,JSON.stringify(expenses));localStorage.setItem(K.w,JSON.stringify(wallets));localStorage.setItem(K.d,JSON.stringify(debts));localStorage.setItem(K.c,JSON.stringify(custom))}catch{msg('تعذر حفظ البيانات')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2100)}function allcats(){return defaults.concat(custom)}function cat(x){return allcats().find(c=>c.id===x)||defaults[7]}function render(){document.querySelector('#bank').textContent=fmt(wallets.account);document.querySelector('#cash').textContent=fmt(wallets.cash);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelector('#view').innerHTML=({expenses:expView,wallets:walletView,debts:debtView,categories:catView,backup:backupView})[tab]();bind()}
function expView(){return `<div class="card"><h2>➕ إضافة مصروف</h2><form id="ef"><div class="grid"><div class="field"><label>المبلغ (${CURRENCY})</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>طريقة الدفع</label><select name="wallet"><option value="cash">💵 نقدية</option><option value="account">💳 بنك</option></select></div><div class="field"><label>الفئة</label><select name="category">${allcats().map(c=>`<option value="${esc(c.id)}">${esc(c.emoji+' '+c.name)}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div></div><div class="field"><label>ملاحظة</label><input name="note" maxlength="200"></div><button>حفظ المصروف</button></form></div><div class="card"><h2>سجل المصاريف</h2>${expenses.length?expenses.slice().reverse().map(e=>`<div class="item row"><div><b>${esc(cat(e.category).emoji+' '+cat(e.category).name)} · ${esc(e.note||'بدون ملاحظة')}</b><div class="muted">${esc(e.date)} ${e.wallet==='cash'?'💵':'💳'}</div></div><div><b>${fmt(e.amount)}</b> <button class="danger" data-del="${esc(e.id)}">حذف</button></div></div>`).join(''):'<div class="empty">لا توجد مصاريف</div>'}</div>`}
function walletView(){return `<div class="card"><h2>إيداع</h2><form id="df"><div class="grid"><div class="field"><label>المبلغ</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>المحفظة</label><select name="wallet"><option value="cash">نقدية</option><option value="account">بنك</option></select></div></div><button>إيداع</button></form></div><div class="card"><h2>تحويل بين المحافظ</h2><form id="tf"><label>من</label><select name="from"><option value="account">بنك</option><option value="cash">نقدية</option></select><label>إلى</label><select name="to"><option value="cash">نقدية</option><option value="account">بنك</option></select><div class="field"><label>المبلغ</label><input name="amount" type="number" min=".01" step=".01" required></div><button>تحويل</button></form></div>`}
function debtView(){let l=debts.filter(d=>d.type==='lend'&&!d.settled).reduce((s,d)=>s+d.amount,0),b=debts.filter(d=>d.type==='borrow'&&!d.settled).reduce((s,d)=>s+d.amount,0);return `<div class="grid"><div class="card green">لك<strong>${fmt(l)}</strong></div><div class="card red">عليك<strong>${fmt(b)}</strong></div></div><div class="card"><h2>إضافة دين</h2><form id="bf"><div class="field"><label>الشخص</label><input name="person" required maxlength="100"></div><div class="grid"><div class="field"><label>المبلغ</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>النوع</label><select name="type"><option value="lend">لك (أقرضته)</option><option value="borrow">عليك (استلفت)</option></select></div></div><div class="field"><label>المحفظة</label><select name="wallet"><option value="cash">نقدية</option><option value="account">بنك</option></select></div><button>إضافة الدين</button></form></div><div class="card"><h2>سجل الديون</h2>${debts.map(d=>`<div class="item"><div class="row"><b>${esc(d.person)} · ${d.type==='lend'?'لك':'عليك'} · ${fmt(d.amount)}</b>${d.settled?'مُسدد':`<button data-settle="${esc(d.id)}">تسديد</button>`}</div></div>`).join('')||'<div class="empty">لا توجد ديون</div>'}</div>`}
function catView(){return `<div class="card"><h2>الفئات</h2>${allcats().map(c=>`<div class="item">${esc(c.emoji+' '+c.name)}</div>`).join('')}</div><div class="card"><h2>إضافة فئة</h2><form id="cf"><div class="field"><label>الاسم</label><input name="name" required></div><div class="grid"><div class="field"><label>إيموجي</label><input name="emoji" value="✨" required></div><div class="field"><label>اللون</label><input name="color" type="color" value="#14b8a6"></div></div><button>إضافة</button></form></div>`}
function backupView(){return `<div class="card"><h2>النسخ الاحتياطي</h2><button id="export">تصدير JSON</button> <button class="secondary" id="import">استيراد JSON</button><input id="file" type="file" accept=".json,application/json" hidden></div>`}
function bind(){let ef=document.querySelector('#ef');if(ef)ef.onsubmit=e=>{e.preventDefault();let f=new FormData(ef),a=round(f.get('amount')),w=f.get('wallet');if(a<=0)return msg('مبلغ غير صحيح');if(wallets[w]<a)return msg('الرصيد غير كاف');wallets[w]=round(wallets[w]-a);expenses.push({id:id(),amount:a,wallet:w,category:f.get('category'),date:f.get('date'),note:f.get('note').trim()});save();render();msg('تم تسجيل المصروف')};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let x=expenses.find(e=>e.id===b.dataset.del);wallets[x.wallet]=round(wallets[x.wallet]+x.amount);expenses=expenses.filter(e=>e.id!==x.id);save();render()});let df=document.querySelector('#df');if(df)df.onsubmit=e=>{e.preventDefault();let f=new FormData(df),a=round(f.get('amount'));wallets[f.get('wallet')]=round(wallets[f.get('wallet')]+a);save();render()};let tf=document.querySelector('#tf');if(tf)tf.onsubmit=e=>{e.preventDefault();let f=new FormData(tf),a=round(f.get('amount')),from=f.get('from'),to=f.get('to');if(from===to||a<=0)return msg('تحقق من التحويل');if(wallets[from]<a)return msg('الرصيد غير كاف');wallets[from]=round(wallets[from]-a);wallets[to]=round(wallets[to]+a);save();render()};let bf=document.querySelector('#bf');if(bf)bf.onsubmit=e=>{e.preventDefault();let f=new FormData(bf),a=round(f.get('amount')),w=f.get('wallet'),type=f.get('type');if(a<=0)return msg('مبلغ غير صحيح');if(type==='lend'&&wallets[w]<a)return msg('الرصيد غير كاف للإقراض');wallets[w]=round(wallets[w]+(type==='borrow'?a:-a));debts.push({id:id(),person:f.get('person').trim(),amount:a,type,wallet:w,settled:false});save();render()};document.querySelectorAll('[data-settle]').forEach(b=>b.onclick=()=>{let d=debts.find(x=>x.id===b.dataset.settle);if(d.type==='borrow'&&wallets[d.wallet]<d.amount)return msg('الرصيد لا يكفي');wallets[d.wallet]=round(wallets[d.wallet]+(d.type==='lend'?d.amount:-d.amount));d.settled=true;save();render()});let cf=document.querySelector('#cf');if(cf)cf.onsubmit=e=>{e.preventDefault();let f=new FormData(cf);custom.push({id:id(),name:f.get('name').trim(),emoji:f.get('emoji'),color:f.get('color')});save();render()};let ex=document.querySelector('#export');if(ex)ex.onclick=()=>{let blob=new Blob([JSON.stringify({version:8,expenses,wallets,debts,customCats:custom})],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='masarifi-backup.json';a.click();URL.revokeObjectURL(u)};let im=document.querySelector('#import'),file=document.querySelector('#file');if(im)im.onclick=()=>file.click();if(file)file.onchange=async()=>{try{let d=JSON.parse(await file.files[0].text());if(!Array.isArray(d.expenses)||!Array.isArray(d.debts)||!Array.isArray(d.customCats)||!d.wallets||!['account','cash'].every(k=>Number.isFinite(Number(d.wallets[k])))||!d.expenses.every(x=>Number(x.amount)>0&&['account','cash'].includes(x.wallet))||!d.debts.every(x=>Number(x.amount)>0&&['lend','borrow'].includes(x.type)))throw 0;expenses=d.expenses;debts=d.debts;custom=d.customCats;wallets={account:round(d.wallets.account),cash:round(d.wallets.cash)};save();render();msg('تم الاستيراد')}catch{msg('ملف غير صالح')}}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelector('#settings').onclick=()=>{tab='backup';render()};render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
