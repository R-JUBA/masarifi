<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<title>مصاريفي</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#111827;--muted:#6b7280;--primary:#0f766e;--primary-hover:#115e59;--line:#e5e7eb;--danger:#e11d48;--green:#059669;--shadow:0 8px 24px -12px rgba(15,23,42,.18);--radius:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;outline:none}
button{border:0;border-radius:12px;padding:12px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;transition:all .2s}
button:active{transform:scale(.97)}
.wrap{max-width:680px;margin:auto;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero{background:linear-gradient(135deg,#0f172a,#0f766e);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-radius:0 0 28px 28px;box-shadow:0 4px 12px rgba(15,118,110,.25)}
.top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top-nav h1{margin:0;font-size:20px;font-weight:800}
.btn-nav{background:rgba(255,255,255,.2);color:#fff;padding:8px 16px;border-radius:12px;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(4px)}
.btn-nav:active{background:rgba(255,255,255,.3)}
.hero p{margin:0 0 16px;font-size:14px;opacity:.9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.balance,.card{padding:16px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);margin:12px 0;border:1px solid var(--line)}
.balance{background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer;transition:transform .15s}
.balance:active{transform:scale(.98)}
.balance strong{display:block;font-size:24px;margin-top:4px;font-weight:800}
.field{margin:12px 0}
.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px;font-weight:600}
.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);transition:border-color .2s}
.field input:focus,.field select:focus{border-color:var(--primary);background:var(--card)}
h2{font-size:18px;margin:0 0 16px;font-weight:700;display:flex;align-items:center;gap:8px}
.muted{font-size:13px;color:var(--muted)}
.green{color:var(--green)}
.red{color:var(--danger)}
.danger{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}
.danger:active{background:#fca5a5;color:#fff}
.secondary{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:24px 0;font-size:14px}
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-bar input{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.search-bar select{width:120px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.expense-item{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.02)}
.expense-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.expense-title{font-weight:700;font-size:15px}
.expense-note{font-size:13px;color:var(--muted);margin-top:2px}
.expense-amount{font-weight:800;font-size:16px;color:var(--danger);direction:ltr}
.expense-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:10px}
.expense-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.expense-actions{display:flex;gap:6px}
.expense-actions button{padding:6px 12px;font-size:12px;border-radius:8px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--primary);border-radius:4px;transition:width .3s}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-content{background:var(--bg);width:90%;max-width:500px;max-height:85vh;border-radius:24px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,.2);display:flex;flex-direction:column;transform:translateY(20px);transition:transform .3s}
.modal-overlay.active .modal-content{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h2{margin:0}
.close-modal{background:none;color:var(--text);font-size:24px;padding:0}
.drag-list{overflow-y:auto;flex:1;padding-bottom:10px;display:flex;flex-direction:column;gap:8px}
.drag-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background-color .2s,transform .15s;touch-action:pan-y}
.drag-item:active{background-color:#f8fafc}
body.dark .drag-item:active{background-color:#0f172a}
.drag-item.dragging-ready{touch-action:none}
.drag-handle{cursor:grab;padding:4px 6px 4px 10px;color:var(--muted);font-size:18px;line-height:1;touch-action:none;display:inline-flex;align-items:center;pointer-events:auto}
.drag-handle:active{cursor:grabbing;color:var(--primary)}
.drag-clone{position:fixed;margin:0;opacity:.96;box-shadow:0 18px 35px rgba(15,23,42,.28);z-index:9999;background-color:var(--card);border:2px solid var(--primary);border-radius:14px;transform:scale(1.03);pointer-events:none;transition:transform .1s ease,box-shadow .1s ease;direction:rtl}
body.dark .drag-clone{box-shadow:0 18px 35px rgba(0,0,0,.55)}
.drag-placeholder{border:2px dashed var(--primary);background:rgba(15,118,110,.08);border-radius:12px;margin:0;flex-shrink:0;transition:all .15s ease}
body.dark .drag-placeholder{background:rgba(15,118,110,.2)}
.drag-item .cat-name{font-weight:600;display:flex;align-items:center;gap:8px}
.drag-item .cat-actions{display:flex;gap:6px}
.drag-item .cat-actions button{padding:4px 10px;font-size:12px;border-radius:8px}
.sub-cat-item{padding-right:32px;background:var(--bg)}
body.dark{--bg:#0b1220;--card:#131c2e;--text:#f1f5f9;--muted:#94a3b8;--line:#243049;--shadow:0 4px 6px -1px rgba(0,0,0,0.2)}
body.dark .hero{background:linear-gradient(135deg,#020617,#115e59)}
body.dark .field input,body.dark .field select,body.dark .search-bar input,body.dark .search-bar select{background:#0f172a}
body.dark .danger{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.2)}
body.dark .secondary{background:#334155;color:#fff;border-color:#475569}
body.dark .balance{background:rgba(0,0,0,.2);border-color:rgba(255,255,255,.1)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(100px);background:#1e293b;color:#fff;padding:12px 24px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:1100;opacity:0}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
#pa{display:none}
@media print{@page{margin:12mm}body.printing{background:#fff!important}body.printing>*:not(#pa){display:none!important}body.printing #pa{display:block;color:#000;background:#fff}#pa table{width:100%;border-collapse:collapse;margin:12px 0}#pa td,#pa th{border:1px solid #999;padding:6px;text-align:start}}
.i{width:1.15em;height:1.15em;vertical-align:-.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block}
@font-face{font-family:Cairo;src:url(cairo.woff2) format("woff2");font-weight:200 1000;font-display:swap}
.hero p{margin:0 0 8px!important}
.hero .balance{margin:4px 0 6px}
.tile{background:var(--card);border:1px solid var(--line);color:var(--text);padding:18px 8px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--shadow)}
.tile .ic{width:46px;height:46px;border-radius:15px;background:color-mix(in srgb,var(--primary) 13%,transparent);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:22px}
.tile .ic .i{width:24px;height:24px}
#bnav{position:fixed;bottom:0;left:0;right:0;z-index:500;display:flex;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px -10px rgba(15,23,42,.25)}
#bnav button{flex:1;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:6px 0;border-radius:12px}
#bnav button.on{color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent)}
#bnav .i{width:22px;height:22px}
.cat-dot{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.expense-item{gap:6px;padding:12px 14px}
.expense-bottom{border-top:0;padding-top:0}
.expense-actions button{padding:3px 10px;font-size:11px;border-radius:8px;opacity:.85}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#view>*{animation:vin .25s ease}
@media (prefers-reduced-motion:reduce){#view>*{animation:none}}
@media print{#bnav{display:none!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="top-nav">
      <h1>📒 مصاريفي</h1>
      <button id="navToggleBtn" class="btn-nav" onclick="toggleNav()">⚙️ الإعدادات</button>
    </div>
    <p>إدارة أموالك ومصاريفك بذكاء</p>
    <div class="grid">
      <div class="balance" data-go="wallets">🏦 الحساب البنكي<strong id="bank">0</strong></div>
      <div class="balance" data-go="wallets">💵 النقدية / الجيب<strong id="cash">0</strong></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="view"></section>
</main>

<nav id="bnav">
  <button data-go="expenses">📄<span>المصاريف</span></button>
  <button data-go="stats">📊<span>الإحصائيات</span></button>
  <button data-go="wallets">👛<span>المحافظ</span></button>
  <button data-go="settings">⚙️<span>المزيد</span></button>
</nav>

<div id="catModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2>🏷️ إدارة وترتيب الفئات</h2>
      <button class="close-modal" onclick="closeCatModal()">✕</button>
    </div>
    <p class="muted" style="margin-top:0; margin-bottom:12px;">اسحب من أيقونة ☰ مباشرة، أو اضغط مطولاً على أي فئة وحركها للأعلى أو الأسفل لترتيبها.</p>
    <div class="drag-list" id="dragList"></div>
    <button onclick="toggleAddCatForm()" class="secondary" style="width:100%; margin-top:8px;">➕ إضافة فئة جديدة</button>
    <div id="addCatWrapper" style="display:none; margin-top:16px; border-top:1px dashed var(--line); padding-top:16px; overflow-y:auto; max-height:45vh;">
      <form id="cf">
        <div class="field"><label>الاسم</label><input name="name" required maxlength="40"></div>
        <div class="grid"><div class="field"><label>إيموجي</label><input name="emoji" value="✨" required maxlength="8"></div><div class="field"><label>اللون</label><input name="color" type="color" value="#0f766e" style="height:44px; padding:4px;"></div></div>
        <div class="field"><label>الفئة الأم</label><select name="parent"><option value="">-- فئة رئيسية --</option></select></div>
        <div class="field"><label>سقف شهري (0 = بدون)</label><input name="limit" type="number" min="0" step=".01" value="0"></div>
        <button type="submit" style="width:100%;">حفظ الفئة</button>
      </form>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const CURRENCY='د.ج'; const VER=50;
const K={e:'masarifi.expenses.v8', w:'masarifi.wallets.v8', d:'masarifi.debts.v8', c:'masarifi.customCats.v1', c2:'masarifi.cats.v2', s:'masarifi.settings.v1', r:'masarifi.recurring.v1', m:'masarifi.moves.v1', g:'masarifi.goals.v1'};
const defaults=[['food','طعام','🍔','#f97316'],['transport','مواصلات','🚌','#3b82f6'],['bills','فواتير','🧾','#64748b'],['health','صحة','💊','#ef4444'],['education','تعليم','📚','#8b5cf6'],['fun','ترفيه','🎮','#ec4899'],['shopping','تسوق','🛍️','#14b8a6'],['other','أخرى','📦','#a3a3a3']].map(([id,name,emoji,color])=>({id,name,emoji,color,parent:null}));

const round=n=>Math.round((Number(n)||0)*100)/100, fmt=n=>round(n).toLocaleString(LOC[LANG],{maximumFractionDigits:2})+' '+CUR_[LANG], id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const safeCol=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#0f766e';
const localISO=(d=new Date())=>{let x=new Date(d.getTime());x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const today=()=>localISO();

function read(k,d){try{let x=localStorage.getItem(k);return x===null?d:JSON.parse(x)}catch{return d}}
let expenses=read(K.e,[]), wallets=read(K.w,{account:0,cash:0}), debts=read(K.d,[]), cats=read(K.c2,null), recurring=read(K.r,[]), moves=read(K.m,[]), goals=read(K.g,[]), tab='expenses', editCat=null, payDebt=null, statMonth='',cmpMonth='', editExp=null, searchQuery='', filterCat='all', cfg=Object.assign({salary:0,budget:0,months:6,startDay:1,warn:80,theme:'light',autoLock:true,lang:'ar',rolloverBudget:false,autoArchive:false,allowNeg:false,lastBackup:0},read(K.s,{}));

if(!Array.isArray(cats)||!cats.length)cats=defaults.concat(read(K.c,[]));
cats.forEach(c=>{if(c.parent===undefined)c.parent=null;});
debts=debts.map(migr);

let LANG=['ar','fr','en'].includes(cfg.lang)?cfg.lang:'ar';

function migr(d){d.payments=Array.isArray(d.payments)?d.payments.filter(p=>Number(p.amount)>0):(d.settled?[{id:id(),amount:round(d.amount),date:''}]:[]);delete d.settled;delete d.wallet;return d}
const paid=d=>round(d.payments.reduce((s,p)=>s+Number(p.amount),0)), rem=d=>Math.max(0,round(d.amount-paid(d)));

function save(){
  try{
    localStorage.setItem(K.e,JSON.stringify(expenses));
    localStorage.setItem(K.w,JSON.stringify(wallets));
    localStorage.setItem(K.d,JSON.stringify(debts));
    localStorage.setItem(K.c2,JSON.stringify(cats));
    localStorage.setItem(K.s,JSON.stringify(cfg));
    localStorage.setItem(K.r,JSON.stringify(recurring));
    localStorage.setItem(K.m,JSON.stringify(moves));
    localStorage.setItem(K.g,JSON.stringify(goals));
  }catch{msg('تعذر حفظ البيانات')}
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let _mt;function msg(s){let t=document.querySelector('#toast');t.textContent=T(s);t.classList.add('on');clearTimeout(_mt);_mt=setTimeout(()=>t.classList.remove('on'),2500)}
function cat(x){return cats.find(c=>c.id===x)||{id:'',name:'غير مصنف',emoji:'📦',color:'#a3a3a3',parent:null}}
function applyTheme(){const d=cfg.theme==='dark'||(cfg.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('dark',d);const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=d?'#020617':'#0f766e'}

function autoArch(){
  if(!cfg.autoArchive) return 0;
  const cur=pKey(today());let n=0;
  expenses.forEach(x=>{const k=pKey(String(x.date||'').slice(0,10));if(!x.archived&&k&&k<cur){x.archived=true;n++}});
  if(n) save();
  return n;
}

function applyRecurring(){
  let changed=false;
  const now=new Date(),cur=now.getFullYear()*12+now.getMonth(),dom=now.getDate();
  recurring.forEach(r=>{
    const amt=round(r.amount);
    if(!((r.wallet==='cash'||r.wallet==='account')&&amt>0))return;
    const m=/^(\d{4})-(\d{2})$/.exec(r.lastApplied||'');
    let start=m?(+m[1])*12+(+m[2]-1)+1:cur;
    start=Math.max(start,cur-11);
    for(let k=start;k<=cur;k++){
      const y=Math.floor(k/12),mo=k%12,dim=new Date(y,mo+1,0).getDate();
      const td=Math.min(Math.max(1,Number(r.dayOfMonth)||1),dim);
      if(k===cur&&dom<td)break;
      if(!cfg.allowNeg&&wallets[r.wallet]<amt)break;
      const ym=y+'-'+String(mo+1).padStart(2,'0');
      expenses.push({id:id(),amount:amt,wallet:r.wallet,category:r.category,date:ym+'-'+String(td).padStart(2,'0'),note:r.note||'مصروف متكرر'});
      wallets[r.wallet]=round(wallets[r.wallet]-amt);
      r.lastApplied=ym;changed=true;
    }
  });
  if(changed) save();
}

function nav(t){ if(tab!==t){tab=t;try{history.pushState({tab:t},'')}catch{}} editCat=null;payDebt=null;editExp=null;render(true) }
function toggleNav(){ nav(tab==='expenses'?'settings':'expenses') }

function render(scrollTop=false){
  applyTheme(); applyLang();
  if(!isDragging) document.querySelectorAll('.drag-clone').forEach(x=>x.remove());
  document.querySelector('#bank').textContent=fmt(wallets.account);
  document.querySelector('#cash').textContent=fmt(wallets.cash);
  
  const navBtn = document.getElementById('navToggleBtn');
  if(tab === 'expenses') {
    navBtn.innerHTML = '⚙️ الإعدادات';
  } else {
    navBtn.innerHTML = '📝 المصاريف';
  }
  
  document.querySelector('#view').innerHTML=({expenses:expView,stats:statView,wallets:walletView,debts:debtView,backup:backupView,settings:settingsView,security:securityView,budget:()=>backBtn()+budgetHTML(),archive:()=>backBtn()+archHTML(),theme:themeView,lang:langView,recurring:()=>backBtn()+recurringHTML(),goals:()=>backBtn()+goalsHTML()})[tab]();
  
  document.querySelectorAll('#bnav [data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===(['expenses','stats','wallets'].includes(tab)?tab:'settings')));
  bind(); ico(document.body); tr(document.body);
  if(scrollTop) setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),50);
  if(tab==='settings') offCheck();
}
async function offCheck(){
  const el=document.getElementById('offst'); if(!el) return;
  let t;
  if(!('serviceWorker' in navigator)) t='⚠️ المتصفح لا يدعم العمل دون اتصال';
  else if(!window.isSecureContext) t='⚠️ يلزم فتح التطبيق عبر https';
  else if(window.__swErr) t='⚠️ تعذّر تفعيل العمل دون اتصال: '+window.__swErr;
  else { try{ const c=await caches.match('./index.html'); t=(navigator.serviceWorker.controller&&c)?'✔ جاهز للعمل دون اتصال':'⚠️ لم يكتمل التجهيز، افتح التطبيق مرة أخرى وأنت متصل'; }catch{ t='⚠️ تعذّر فحص التخزين المؤقت'; } }
  el.textContent=T(t);
}

function backBtn(){return `<button class="secondary" style="margin-bottom:16px; width:100%; padding:12px; border-radius:12px;" data-go="settings">← العودة للإعدادات</button>`}

function settingsView(){
  const items = [
    ['budget', '🎯', 'الميزانية الشهرية'],
    ['archive', '🗃️', 'الأرشيف'],
    ['stats', '📊', 'الإحصائيات'],
    ['wallets', '👛', 'المحافظ'],
    ['debts', '🤝', 'الديون'],
    ['recurring', '🔁', 'المصاريف المتكررة'],
    ['goals', '🏆', 'أهداف الادخار'],
    ['categories', '🏷️', 'الفئات'],
    ['backup', '💾', 'النسخ الاحتياطي'],
    ['security', '🔒', 'الحماية'],
    ['theme', '🎨', 'المظهر'],
    ['lang', '🌐', 'اللغة']
  ];
  return `<div class="card"><h2>⚙️ الإعدادات</h2>
    <div class="grid" style="grid-template-columns:1fr 1fr; gap:12px;">
      ${items.map(([k,i,n])=>`<button class="tile" data-go="${k}"><span class="ic">${i}</span><span style="font-size:13px; font-weight:600;">${n}</span></button>`).join('')}
    </div>
  </div>
  <div class="card" style="border-color: var(--danger); margin-top: 24px;">
    <button id="deleteAllDataBtn" class="danger" style="width: 100%;">🗑️ حذف جميع البيانات نهائياً</button>

function buildCatOptions(selectedId) {

    if (subs.length > 0) {
      html += `<optgroup label="${esc(m.emoji+' '+T(m.name))}">`;
      html += `<option value="${esc(m.id)}" ${m.id===selectedId?'selected':''}>${esc(m.emoji+' '+m.name)} (رئيسي)</option>`;
      subs.forEach(s => {
        html += `<option value="${esc(s.id)}" ${s.id===selectedId?'selected':''}>&nbsp;&nbsp;↳ ${esc(s.emoji+' '+s.name)}</option>`;
      });
    } else {
      html += `<option value="${esc(m.id)}" ${m.id===selectedId?'selected':''}>${esc(m.emoji+' '+m.name)}</option>`;
    }
    if (subs.length > 0) html += `</optgroup>`;
  });
  cats.filter(c => c.parent && !cats.find(m => m.id === c.parent)).forEach(orphan => {
    html += `<option value="${esc(orphan.id)}" ${orphan.id===selectedId?'selected':''}>${esc(orphan.emoji+' '+orphan.name)}</option>`;

  return html;
}

function trendHTML(){

  grid=[0,1,2,3,4].map(k=>{let v=nm*k/4;return `<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="var(--muted)">${round(v).toLocaleString(LOC[LANG])}</text>`}).join(''),

function effBudgetFor(mk){
  let base = cfg.budget, roll = 0;
  if (cfg.rolloverBudget && base > 0) {
    let pm = prevMonth(mk);
    let pmSpent = sum(expenses.filter(e => pKey(e.date) === pm));
    if (base > pmSpent) roll = round(base - pmSpent);
  }
  return { base, roll, eff: round(base + roll) };
}

function pKey(ds){let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(ds);if(!m)return'';let y=+m[1],mo=+m[2],d=+m[3],dim=new Date(Date.UTC(y,mo,0)).getUTCDate(),sd=Math.min(cfg.startDay||1,dim);if(d<sd){mo--;if(!mo){mo=12;y--}}return y+'-'+String(mo).padStart(2,'0')}
function pBounds(k){let[y,m]=k.split('-').map(Number),sd=(a,b)=>Math.min(cfg.startDay||1,new Date(Date.UTC(a,b,0)).getUTCDate()),ny=m==12?y+1:y,nm=m==12?1:m+1;return[Date.UTC(y,m-1,sd(y,m)),Date.UTC(ny,nm-1,sd(ny,nm))-864e5]}
function pRange(k){const[st,en]=pBounds(k),f=t=>new Date(t).toISOString().slice(0,10);return f(st)+' → '+f(en)}
const smo=()=>statMonth||pKey(today());

}

const _enc=new TextEncoder(),_hx=b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
async function kdf(p,salt){let k=await crypto.subtle.importKey('raw',_enc.encode(p),'PBKDF2',false,['deriveBits']);return _hx(await crypto.subtle.deriveBits({name:'PBKDF2',salt:_enc.encode(salt),iterations:150000,hash:'SHA-256'},k,256))}
async function newPw(p){let s=_hx(crypto.getRandomValues(new Uint8Array(16)));return{s,h:await kdf(p,s)}}
async function checkPw(p){return!!cfg.pw&&(await kdf(String(p||''),cfg.pw.s))===cfg.pw.h}

let dragClone = null;
let dragPlaceholder = null;

function openCatModal() {
  document.getElementById('catModal').classList.add('active');
  renderCatModalList();

}

function closeCatModal() {
  cancelActiveDrag();
  document.getElementById('catModal').classList.remove('active');
  editCat = null;
  render();
}

function toggleAddCatForm(show) {
  let w = document.getElementById('addCatWrapper');
  if (show === undefined) {
    w.style.display = w.style.display === 'none' ? 'block' : 'none';
  } else {
    w.style.display = show ? 'block' : 'none';
  }
  if (w.style.display === 'block') {
    let opts = `<option value="">-- فئة رئيسية --</option>`;
    cats.filter(c => !c.parent).forEach(c => {
      opts += `<option value="${esc(c.id)}">${esc(c.emoji + ' ' + c.name)}</option>`;
    });
    const sel = document.querySelector('#cf select[name="parent"]');
    if (sel) sel.innerHTML = opts;
    tr(w);
  }
}

function buildParentSelectHTML(currentCat) {
  let opts = `<option value="" ${!currentCat.parent ? 'selected' : ''}>-- فئة رئيسية --</option>`;
  cats.filter(c => !c.parent && c.id !== currentCat.id).forEach(c => {
    opts += `<option value="${esc(c.id)}" ${currentCat.parent === c.id ? 'selected' : ''}>${esc(c.emoji + ' ' + c.name)}</option>`;
  });
  return `<div class="field"><label>الفئة الأم</label><select name="parent">${opts}</select></div>`;
}

function bindCatModal() {
  const list = document.getElementById('dragList');

  let cf = document.querySelector('#cf');
  if (cf) {
    cf.onsubmit = e => {
      e.preventDefault();
      let f = new FormData(cf), n = f.get('name').trim();
      if (!n) return msg('أدخل اسماً');
      cats.push({
        id: id(), name: n, emoji: f.get('emoji').trim() || '✨',
        color: safeCol(f.get('color')), limit: Math.max(0, round(f.get('limit'))),
        parent: f.get('parent') || null
      });
      save(); renderCatModalList(); cf.reset(); toggleAddCatForm(false); msg('تمت إضافة الفئة');
    };
  }

  list.querySelectorAll('.edit-cat-btn').forEach(b => b.onclick = e => {
    e.stopPropagation(); editCat = b.dataset.id; renderCatModalList();
  });
  list.querySelectorAll('.cancel-edit-cat').forEach(b => b.onclick = e => {
    e.stopPropagation(); editCat = null; renderCatModalList();
  });
  list.querySelectorAll('.del-cat-btn').forEach(b => b.onclick = e => {
    e.stopPropagation();
    if (cats.length <= 1) return msg('يجب إبقاء فئة واحدة على الأقل');
    let c = cats.find(x => x.id === b.dataset.id);
    if (!c || !confirm('حذف فئة «' + c.name + '»؟ ستظهر مصاريفها السابقة كغير مصنفة.')) return;
    cats.filter(x => x.parent === c.id).forEach(x => x.parent = null);
    cats = cats.filter(x => x.id !== c.id);
    save(); renderCatModalList(); render();
  });
  list.querySelectorAll('.ecf').forEach(fm => fm.onsubmit = e => {
    e.preventDefault();
    let f = new FormData(fm), c = cats.find(x => x.id === fm.dataset.id), n = f.get('name').trim();
    if (!c) return;
    if (!n) return msg('أدخل اسماً');
    let newParent = f.get('parent') || null;
    if (newParent) cats.filter(x => x.parent === c.id).forEach(x => x.parent = null);
    c.name = n; c.emoji = f.get('emoji').trim() || '✨';
    c.color = safeCol(f.get('color')); c.limit = Math.max(0, round(f.get('limit')));
    c.parent = newParent;
    editCat = null; save(); renderCatModalList(); render(); msg('تم تعديل الفئة');
  });

  list.onpointerdown = handlePointerDown;
  list.oncontextmenu = e => { if (isDragging || pressTimer) e.preventDefault(); };
}

function handlePointerDown(e) {
  if (e.button && e.button !== 0) return;
  if (isDragging || pressTimer || e.isPrimary === false) return;
  const item = e.target.closest('.drag-item');
  if (!item || item.tagName === 'FORM' || e.target.closest('button') || e.target.closest('input') || e.target.closest('select')) return;

  const isHandle = !!e.target.closest('.drag-handle');
  startX = e.clientX;
  startY = e.clientY;
  currentPointerY = e.clientY;

  const pointerId = e.pointerId;
  const delay = isHandle ? 40 : 300;

  pressTimer = setTimeout(() => {
    pressTimer = null;
    startDrag(item, e, pointerId);
  }, delay);

  const checkMoveBeforeStart = ev => {
    if (!pressTimer) return;
    if (Math.abs(ev.clientX - startX) > 10 || Math.abs(ev.clientY - startY) > 10) {
      clearPendingPress();
    }
  };

  const clearPendingPress = () => {
    if (pressTimer) {
      clearTimeout(pressTimer);
      pressTimer = null;
    }
    document.removeEventListener('pointermove', checkMoveBeforeStart);
    document.removeEventListener('pointerup', clearPendingPress);
    document.removeEventListener('pointercancel', clearPendingPress);
  };

  document.addEventListener('pointermove', checkMoveBeforeStart);
  document.addEventListener('pointerup', clearPendingPress, { once: true });
  document.addEventListener('pointercancel', clearPendingPress, { once: true });
}

document.addEventListener('touchmove', e => {
  if (isDragging) e.preventDefault();
}, { passive: false });

function startDrag(item, e, pointerId) {
  if (isDragging) return;
  if (navigator.vibrate) navigator.vibrate(40);
  isDragging = true;
  dragItem = item;
  item.classList.add('dragging-ready');

  try { item.setPointerCapture(pointerId); } catch (_) {}

  const list = document.getElementById('dragList');
  const rect = item.getBoundingClientRect();

  hiddenSubItems = [];
  if (item.dataset.isMain === '1') {
    const mainId = item.dataset.id;
    list.querySelectorAll(`.sub-cat-item[data-parent="${CSS.escape(mainId)}"]`).forEach(sub => {
      sub.style.display = 'none';
      hiddenSubItems.push(sub);
    });
  }

  dragPlaceholder = document.createElement('div');
  dragPlaceholder.className = 'drag-placeholder';
  dragPlaceholder.style.height = `${rect.height}px`;
  dragPlaceholder.style.width = `${rect.width}px`;

  item.parentNode.insertBefore(dragPlaceholder, item);
  item.style.display = 'none';

  dragClone = item.cloneNode(true);
  dragClone.classList.add('drag-clone');
  dragClone.style.display = 'flex';
  dragClone.style.top = `${rect.top}px`;
  dragClone.style.left = `${rect.left}px`;
  dragClone.style.width = `${rect.width}px`;
  dragClone.style.height = `${rect.height}px`;
  document.body.appendChild(dragClone);

  dragClone.offsetY = startY - rect.top;
  dragClone.offsetX = startX - rect.left;

  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);

  startAutoScroll();
}

function onDragMove(e) {
  if (!isDragging || !dragClone) return;
  currentPointerY = e.clientY;
  dragClone.style.top = `${e.clientY - dragClone.offsetY}px`;
  dragClone.style.left = `${e.clientX - dragClone.offsetX}px`;
  updatePlaceholderPosition(e.clientX, e.clientY);
}

function updatePlaceholderPosition(clientX, clientY) {
  const list = document.getElementById('dragList');
  const listRect = list.getBoundingClientRect();
  const clampedX = Math.max(listRect.left + 20, Math.min(clientX, listRect.right - 20));
  const el = document.elementFromPoint(clampedX, clientY);
  const targetItem = el ? el.closest('.drag-item') : null;

  if (targetItem && targetItem !== dragItem && targetItem.tagName !== 'FORM' && targetItem.style.display !== 'none') {
    if (dragItem && dragItem.dataset.isMain === '1') {
      const gid = targetItem.dataset.isMain === '1' ? targetItem.dataset.id : targetItem.dataset.parent;
      const kids = Array.from(list.children).filter(x => x.dataset && x.dataset.parent === gid && x.style.display !== 'none');
      const first = Array.from(list.children).find(x => x.dataset && x.dataset.id === gid && x.dataset.isMain === '1');
      if (!first) return;
      const last = kids.length ? kids[kids.length - 1] : first;
      const gmid = (first.getBoundingClientRect().top + last.getBoundingClientRect().bottom) / 2;
      list.insertBefore(dragPlaceholder, clientY < gmid ? first : last.nextSibling);
      return;
    }
    const firstMain = Array.from(list.children).find(x => x.dataset && x.dataset.isMain === '1' && x.style.display !== 'none');
    const targetRect = targetItem.getBoundingClientRect();
    const targetMid = targetRect.top + targetRect.height / 2;
    if (clientY < targetMid) {
      if (firstMain && targetItem === firstMain) {
        list.insertBefore(dragPlaceholder, firstMain.nextSibling);
      } else {
        list.insertBefore(dragPlaceholder, targetItem);
      }
    } else {
      list.insertBefore(dragPlaceholder, targetItem.nextSibling);
    }
  }
}

function startAutoScroll() {
  const list = document.getElementById('dragList');
  const step = () => {
    if (!isDragging) return;
    const rect = list.getBoundingClientRect();
    const threshold = 45;
    const maxSpeed = 8;

    if (currentPointerY < rect.top + threshold) {
      list.scrollTop -= maxSpeed;
    } else if (currentPointerY > rect.bottom - threshold) {
      list.scrollTop += maxSpeed;
    }
    autoScrollRAF = requestAnimationFrame(step);
  };
  autoScrollRAF = requestAnimationFrame(step);
}

function onDragEnd() {
  if (!isDragging) return;
  isDragging = false;
  if (autoScrollRAF) cancelAnimationFrame(autoScrollRAF);

  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  document.removeEventListener('pointercancel', onDragEnd);

  if (dragClone) { dragClone.remove(); dragClone = null; }

  if (dragItem && dragPlaceholder && dragPlaceholder.parentNode) {
    dragItem.style.display = '';
    dragItem.classList.remove('dragging-ready');
    dragPlaceholder.parentNode.insertBefore(dragItem, dragPlaceholder);

    let refNode = dragItem.nextSibling;
    hiddenSubItems.forEach(sub => {
      sub.style.display = '';
      dragItem.parentNode.insertBefore(sub, refNode);
    });
    hiddenSubItems = [];
    dragPlaceholder.remove();
  }

  dragItem = null; dragPlaceholder = null;
  saveNewCatOrder();
}

function cancelActiveDrag() {
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  if (isDragging) onDragEnd();
  document.querySelectorAll('.drag-clone').forEach(x => x.remove());
}

function saveNewCatOrder() {
  const list = document.getElementById('dragList');
  const elements = Array.from(list.querySelectorAll('.drag-item'));
  const newCats = [];
  let currentMainId = null;

  elements.forEach(el => {
    const c = cats.find(x => x.id === el.dataset.id);
    if (!c) return;
    if (!c.parent) {
      currentMainId = c.id;
    } else if (currentMainId) {
      c.parent = currentMainId;
    }
    newCats.push(c);
  });

  if (newCats.length === cats.length) {
    cats = newCats;
    save();
    renderCatModalList();
  }
}

  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window.__rl){window.__rl=1;updBar()}});
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(e=>{window.__swErr=String((e&&e.message)||e).slice(0,70)}))
}
</script></body></html>
