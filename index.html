</style></head><body><header class="hero"><div class="wrap"><div class="row"><h1>📒 مصاريفي</h1><button id="settings">⚙️</button></div><p>إدارة أموالك ومصاريفك وديونك</p><div class="grid"><div class="balance">🏦 الحساب البنكي<strong id="bank">0</strong></div><div class="balance">💵 النقدية / الجيب<strong id="cash">0</strong></div></div></div></header><main class="wrap"><nav class="tabs"><button data-tab="expenses" class="active">المصاريف</button><button data-tab="stats">الإحصائيات</button><button data-tab="wallets">المحافظ</button><button data-tab="debts">الديون</button><button data-tab="categories">الفئات</button><button data-tab="backup">النسخ الاحتياطي</button></nav><section id="view"></section></main><div class="toast" id="toast"></div>
<script>
'use strict';const CURRENCY='د.ج';const K={e:'masarifi.expenses.v8',w:'masarifi.wallets.v8',d:'masarifi.debts.v8',c:'masarifi.customCats.v1',c2:'masarifi.cats.v2',s:'masarifi.settings.v1'};const defaults=[['food','طعام','🍔','#f97316'],['transport','مواصلات','🚌','#3b82f6'],['bills','فواتير','🧾','#64748b'],['health','صحة','💊','#ef4444'],['education','تعليم','📚','#8b5cf6'],['fun','ترفيه','🎮','#ec4899'],['shopping','تسوق','🛍️','#14b8a6'],['other','أخرى','📦','#a3a3a3']].map(([id,name,emoji,color])=>({id,name,emoji,color}));const round=n=>Math.round((Number(n)||0)*100)/100,fmt=n=>round(n).toLocaleString('ar-DZ',{maximumFractionDigits:2})+' '+CURRENCY,id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),today=()=>new Date().toISOString().slice(0,10);function read(k,d){try{let x=localStorage.getItem(k);return x===null?d:JSON.parse(x)}catch{return d}}let expenses=read(K.e,[]),wallets=read(K.w,{account:0,cash:0}),debts=read(K.d,[]),cats=read(K.c2,null),tab='expenses',editCat=null,payDebt=null,statMonth='',editExp=null,cfg=Object.assign({salary:0,budget:0,months:6,startDay:1,warn:80,theme:'light'},read(K.s,{}));if(!Array.isArray(cats)||!cats.length)cats=defaults.concat(read(K.c,[]));debts=debts.map(migr);function migr(d){d.payments=Array.isArray(d.payments)?d.payments.filter(p=>Number(p.amount)>0):(d.settled?[{id:id(),amount:round(d.amount),date:''}]:[]);delete d.settled;delete d.wallet;return d}const paid=d=>round(d.payments.reduce((s,p)=>s+Number(p.amount),0)),rem=d=>Math.max(0,round(d.amount-paid(d)));function save(){try{localStorage.setItem(K.e,JSON.stringify(expenses));localStorage.setItem(K.w,JSON.stringify(wallets));localStorage.setItem(K.d,JSON.stringify(debts));localStorage.setItem(K.c2,JSON.stringify(cats));localStorage.setItem(K.s,JSON.stringify(cfg))}catch{msg('تعذر حفظ البيانات')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2100)}function allcats(){return cats}function cat(x){return cats.find(c=>c.id===x)||{id:'',name:'غير مصنف',emoji:'📦',color:'#a3a3a3'}}function applyTheme(){document.body.classList.toggle('dark',cfg.theme==='dark'||(cfg.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))}function render(){applyTheme();document.querySelector('#bank').textContent=fmt(wallets.account);document.querySelector('#cash').textContent=fmt(wallets.cash);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelector('#view').innerHTML=({expenses:expView,stats:statView,wallets:walletView,debts:debtView,categories:catView,backup:backupView})[tab]();bind()}
function expView(){return budgetHTML()+`<div class="card"><h2>➕ إضافة مصروف</h2><form id="ef"><div class="grid"><div class="field"><label>المبلغ (${CURRENCY})</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>طريقة الدفع</label><select name="wallet"><option value="cash">💵 نقدية</option><option value="account">💳 بنك</option></select></div><div class="field"><label>الفئة</label><select name="category">${allcats().map(c=>`<option value="${esc(c.id)}">${esc(c.emoji+' '+c.name)}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div></div><div class="field"><label>ملاحظة</label><input name="note" maxlength="200"></div><button>حفظ المصروف</button></form></div><div class="card"><h2>سجل المصاريف</h2>${visible().length?visible().slice().reverse().map(expRow).join(''):'<div class="empty">لا توجد مصاريف</div>'}</div>`+archHTML()}
function walletView(){return `<div class="card"><h2>✏️ تعديل الرصيد</h2><form id="wf"><div class="grid"><div class="field"><label>🏦 الحساب البنكي</label><input name="account" type="number" min="0" step=".01" value="${wallets.account}" required></div><div class="field"><label>💵 النقدية</label><input name="cash" type="number" min="0" step=".01" value="${wallets.cash}" required></div></div><button>حفظ الرصيد</button></form></div><div class="card"><h2>إيداع</h2><form id="df"><div class="grid"><div class="field"><label>المبلغ</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>المحفظة</label><select name="wallet"><option value="cash">نقدية</option><option value="account">بنك</option></select></div></div><button>إيداع</button></form></div><div class="card"><h2>تحويل بين المحافظ</h2><form id="tf"><label>من</label><select name="from"><option value="account">بنك</option><option value="cash">نقدية</option></select><label>إلى</label><select name="to"><option value="cash">نقدية</option><option value="account">بنك</option></select><div class="field"><label>المبلغ</label><input name="amount" type="number" min=".01" step=".01" required></div><button>تحويل</button></form></div>`}
function debtRow(d){let p=paid(d),r=rem(d),pc=d.amount>0?Math.min(100,p/d.amount*100):0;return `<div class="item"><div class="row"><b>${esc(d.person)} · ${d.type==='lend'?'لك':'عليك'} · ${fmt(d.amount)}</b><div>${r>0?`<button data-pay="${esc(d.id)}">+ دفعة</button> `:''}<button class="danger" data-deldebt="${esc(d.id)}">حذف</button></div></div><div class="bar"><i style="width:${pc}%"></i></div><div class="muted">${r>0?`مسدد ${fmt(p)} · المتبقي <b>${fmt(r)}</b>`:'<span class="green">✔ مسدد بالكامل</span>'}</div>${d.payments.map(x=>`<div class="row muted"><span>${esc(x.date||'')} · ${fmt(x.amount)}</span><button class="secondary" style="padding:4px 10px" data-delpay="${esc(x.id)}" data-debt="${esc(d.id)}">✕</button></div>`).join('')}${payDebt===d.id&&r>0?`<form class="pf" data-id="${esc(d.id)}"><div class="grid"><div class="field"><label>مبلغ الدفعة</label><input name="amount" type="number" min=".01" max="${r}" step=".01" value="${r}" required></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div></div><div class="row"><button>حفظ الدفعة</button><button type="button" class="secondary" data-cancelpay>إلغاء</button></div></form>`:''}</div>`}
function debtView(){let l=debts.filter(d=>d.type==='lend').reduce((s,d)=>s+rem(d),0),b=debts.filter(d=>d.type==='borrow').reduce((s,d)=>s+rem(d),0);return `<div class="grid"><div class="card green">لك (المتبقي)<strong>${fmt(l)}</strong></div><div class="card red">عليك (المتبقي)<strong>${fmt(b)}</strong></div></div><div class="card"><h2>إضافة دين</h2><form id="bf"><div class="field"><label>الشخص</label><input name="person" required maxlength="100"></div><div class="grid"><div class="field"><label>المبلغ</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>النوع</label><select name="type"><option value="lend">لك (أقرضته)</option><option value="borrow">عليك (استلفت)</option></select></div></div><div class="muted">الديون لا تؤثر على أرصدة المحافظ، ويمكن تسديدها على دفعات</div><button>إضافة الدين</button></form></div><div class="card"><h2>سجل الديون</h2>${debts.map(debtRow).join('')||'<div class="empty">لا توجد ديون</div>'}</div>`}
function catView(){return `<div class="card"><h2>الفئات</h2>${cats.map(c=>c.id===editCat?`<form class="item ecf" data-id="${esc(c.id)}"><div class="field"><label>الاسم</label><input name="name" value="${esc(c.name)}" required maxlength="40"></div><div class="grid"><div class="field"><label>إيموجي</label><input name="emoji" value="${esc(c.emoji)}" required maxlength="8"></div><div class="field"><label>اللون</label><input name="color" type="color" value="${esc(c.color||'#14b8a6')}"></div></div><div class="field"><label>سقف شهري (0 = بدون سقف)</label><input name="limit" type="number" min="0" step=".01" value="${c.limit||0}"></div><div class="row"><button>حفظ</button><button type="button" class="secondary" data-cancelcat>إلغاء</button></div></form>`:`<div class="item row"><div>${esc(c.emoji+' '+c.name)}${c.limit>0?` <span class="muted">· سقف ${fmt(c.limit)}</span>`:''}</div><div><button class="secondary" data-editcat="${esc(c.id)}">تعديل</button> <button class="danger" data-delcat="${esc(c.id)}">حذف</button></div></div>`).join('')}</div><div class="card"><h2>إضافة فئة</h2><form id="cf"><div class="field"><label>الاسم</label><input name="name" required maxlength="40"></div><div class="grid"><div class="field"><label>إيموجي</label><input name="emoji" value="✨" required maxlength="8"></div><div class="field"><label>اللون</label><input name="color" type="color" value="#14b8a6"></div></div><div class="field"><label>سقف شهري (0 = بدون سقف)</label><input name="limit" type="number" min="0" step=".01" value="0"></div><button>إضافة</button></form></div>`}
const DAY=864e5,ts=x=>{let[y,m,d]=x.split('-').map(Number);return Date.UTC(y,m-1,d)},p2=n=>String(n).padStart(2,'0'),mOf=e=>pKey(String(e.date||'')),sum=a=>round(a.reduce((t,e)=>t+Number(e.amount),0));
function prevMonth(m){let[y,mo]=m.split('-').map(Number);mo--;if(!mo){mo=12;y--}return y+'-'+p2(mo)}
function donutHTML(rows,tot){let R=70,C=2*Math.PI*R,acc=0,seg=rows.map(r=>{let len=r.v/tot*C,x=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${esc(r.c.color||'#94a3b8')}" stroke-width="28" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"/>`;acc+=len;return x}).join('');return `<svg viewBox="0 0 200 200" style="width:100%;max-width:230px;display:block;margin:auto">${seg}<text x="100" y="94" text-anchor="middle" font-size="11" fill="#64748b">المجموع</text><text x="100" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="currentColor">${fmt(tot)}</text></svg>`+rows.map(r=>`<div class="row" style="padding:5px 0"><span><i style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${esc(r.c.color||'#94a3b8')};margin-left:6px"></i>${esc(r.c.emoji+' '+r.c.name)} · ${Math.round(r.v/tot*100)}%</span><b>${fmt(r.v)}</b></div>`).join('')}
function trendHTML(){let t0=ts(today()),wk=Array(8).fill(0);expenses.forEach(e=>{if(!e.date)return;let df=Math.floor((t0-ts(e.date))/DAY);if(df>=0&&df<56)wk[7-Math.floor(df/7)]+=Number(e.amount)});wk=wk.map(round);let mx=Math.max(...wk,1),u=Math.pow(10,Math.floor(Math.log10(mx))),nm=Math.ceil(mx/u)*u,W=320,H=170,L=42,Rr=20,T=12,B=26,X=i=>L+i*(W-L-Rr)/7,Y=v=>T+(1-v/nm)*(H-T-B),pts=wk.map((v,i)=>X(i)+','+Y(v)),grid=[0,1,2,3,4].map(k=>{let v=nm*k/4;return `<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e2e8f0"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="#64748b">${round(v).toLocaleString('ar-DZ')}</text>`}).join(''),lb=wk.map((v,i)=>{let d=new Date(t0-(7*(7-i)+6)*DAY);return `<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#64748b">${p2(d.getUTCDate())}/${p2(d.getUTCMonth()+1)}</text>`}).join('');return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;direction:ltr">${grid}<polygon points="${X(0)},${Y(0)} ${pts.join(' ')} ${X(7)},${Y(0)}" fill="#14b8a633"/><polyline points="${pts.join(' ')}" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"/>${wk.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="#0f766e"/>`).join('')}${lb}</svg>`}
function statView(){let ms=expenses.filter(e=>mOf(e)===smo()),tot=sum(ms),by={};ms.forEach(e=>by[e.category]=round((by[e.category]||0)+Number(e.amount)));let rows=Object.entries(by).map(([k,v])=>({c:cat(k),v})).sort((a,b)=>b.v-a.v),pm=prevMonth(smo()),pt=sum(expenses.filter(e=>mOf(e)===pm)),ch=pt>0?Math.round((tot-pt)/pt*100):null,badge=ch===null?(tot>0?'<span class="muted">جديد</span>':'<span class="muted">—</span>'):`<b class="${ch>0?'red':'green'}">${ch>0?'▲':'▼'} ${Math.abs(ch)}%</b>`;return `<div class="card"><div class="field"><label>📅 الفترة (الشهر)</label><input id="sm" type="month" value="${esc(smo())}"></div><div class="muted">الفترة: ${pRange(smo())}</div><div class="row" style="margin-top:10px"><button id="xpdf">📄 PDF</button><button id="xls" class="secondary">📊 Excel</button></div></div><div class="card"><h2>📊 توزيع المصاريف حسب الفئة</h2>${tot>0?donutHTML(rows,tot):'<div class="empty">لا توجد مصاريف في هذا الشهر</div>'}</div><div class="card"><h2>📈 اتجاه الإنفاق — آخر 8 أسابيع</h2>${trendHTML()}</div><div class="card"><h2>⚖️ مقارنة شهرية</h2><div class="grid"><div><div class="muted">الشهر السابق · ${esc(pm)}</div><b>${fmt(pt)}</b></div><div><div class="muted">الشهر المحدد · ${esc(smo())}</div><b>${fmt(tot)}</b></div></div><div class="row" style="margin-top:10px"><span class="muted">التغيّر</span>${badge}</div></div>`}
const visible=()=>expenses.filter(x=>!x.archived);
function expRow(e){if(e.id===editExp)return `<form class="item eef" data-id="${esc(e.id)}"><div class="grid"><div class="field"><label>المبلغ</label><input name="amount" type="number" min=".01" step=".01" value="${e.amount}" required></div><div class="field"><label>الدفع</label><select name="wallet"><option value="cash"${e.wallet==='cash'?' selected':''}>💵 نقدية</option><option value="account"${e.wallet==='account'?' selected':''}>💳 بنك</option></select></div><div class="field"><label>الفئة</label><select name="category">${cats.map(c=>`<option value="${esc(c.id)}"${c.id===e.category?' selected':''}>${esc(c.emoji+' '+c.name)}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${esc(e.date)}" required></div></div><div class="field"><label>ملاحظة</label><input name="note" maxlength="200" value="${esc(e.note||'')}"></div><div class="row"><button>حفظ</button><button type="button" class="secondary" data-cancelexp>إلغاء</button></div></form>`;return `<div class="item row"><div><b>${esc(cat(e.category).emoji+' '+cat(e.category).name)} · ${esc(e.note||'بدون ملاحظة')}</b><div class="muted">${esc(e.date)} ${e.wallet==='cash'?'💵':'💳'}</div></div><div><b>${fmt(e.amount)}</b> <button class="secondary" data-editexp="${esc(e.id)}">تعديل</button> <button class="danger" data-del="${esc(e.id)}">حذف</button></div></div>`}
function budgetHTML(){let mk=pKey(today()),ms=expenses.filter(e=>pKey(e.date)===mk),sp=round(ms.reduce((t,e)=>t+Number(e.amount),0)),b=cfg.budget,left=round(b-sp),pc=b>0?Math.min(100,sp/b*100):0;return `<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px"><div class="card" style="padding:10px"><div class="muted">مصاريف الشهر</div><b>${fmt(sp)}</b></div><div class="card" style="padding:10px"><div class="muted">المتبقي من الميزانية</div><b class="${left<0?'red':'green'}">${b>0?fmt(left):'—'}</b></div><div class="card" style="padding:10px"><div class="muted">عدد المصاريف</div><b>${ms.length}</b></div></div><div class="card"><h2>🎯 الميزانية الشهرية</h2><div class="muted">الفترة الحالية: ${pRange(mk)}</div><form id="cfgf"><div class="grid"><div class="field"><label>الراتب الشهري</label><input name="salary" type="number" min="0" step=".01" value="${cfg.salary}"></div><div class="field"><label>حد الإنفاق لهذا الشهر</label><input name="budget" type="number" min="0" step=".01" value="${cfg.budget}"></div></div><div class="grid"><div class="field"><label>يوم بداية الشهر (1–31)</label><input name="startDay" type="number" min="1" max="31" value="${cfg.startDay}"></div><div class="field"><label>التنبيه عند (٪) من سقف الفئة</label><input name="warn" type="number" min="1" max="100" value="${cfg.warn}"></div></div><button>حفظ</button></form>${b>0?`<div class="bar"><i style="width:${pc}%${left<0?';background:#dc2626':''}"></i></div><div>${left>=0?`المتبقي من الميزانية <b>${fmt(left)}</b> (${Math.round(pc)}٪ مستخدم)`:`<span class="red">تجاوزت الميزانية بـ ${fmt(-left)}</span>`}</div>`:''}${cfg.salary>0?`<div class="muted">المتبقي من الراتب: ${fmt(cfg.salary-sp)}</div>`:''}<div class="muted">يمكنك وضع 0 لإلغاء حد الإنفاق. الراتب والميزانية قيمتان منفصلتان.</div></div>`+limitsHTML()}
function archHTML(){let n=expenses.filter(x=>x.archived).length;return `<div class="card"><h2>📦 الأرشيف</h2><form id="arf"><div class="field"><label>أرشفة المصاريف الأقدم من (أشهر)</label><input name="months" type="number" min="1" max="60" value="${cfg.months}" required></div><button>أرشفة المصاريف القديمة</button></form><div class="muted" style="margin-top:8px">المؤرشف: ${n} مصروف (يبقى في الإحصائيات ولا يظهر في السجل)</div>${n?'<button class="secondary" id="unarch" style="margin-top:8px">استرجاع المؤرشف</button>':''}</div>`}

function pKey(ds){let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(ds);if(!m)return'';let y=+m[1],mo=+m[2],d=+m[3],dim=new Date(Date.UTC(y,mo,0)).getUTCDate(),sd=Math.min(cfg.startDay||1,dim);if(d<sd){mo--;if(!mo){mo=12;y--}}return y+'-'+String(mo).padStart(2,'0')}
function pRange(k){let[y,m]=k.split('-').map(Number),sd=(a,b)=>Math.min(cfg.startDay||1,new Date(Date.UTC(a,b,0)).getUTCDate()),ny=m==12?y+1:y,nm=m==12?1:m+1,st=Date.UTC(y,m-1,sd(y,m)),en=Date.UTC(ny,nm-1,sd(ny,nm))-864e5,f=t=>new Date(t).toISOString().slice(0,10);return f(st)+' → '+f(en)}
const smo=()=>statMonth||pKey(today());
function catSpent(id){let k=pKey(today());return round(expenses.filter(e=>e.category===id&&pKey(e.date)===k).reduce((t,e)=>t+Number(e.amount),0))}
function limitNote(id){let c=cat(id);if(!(c.limit>0))return'';let p=catSpent(id)/c.limit*100;return p>=100?'⛔ تجاوزت سقف '+c.name:p>=cfg.warn?'⚠️ اقتربت من سقف '+c.name+' ('+Math.round(p)+'٪)':''}
function limitsHTML(){let L=cats.filter(c=>c.limit>0);if(!L.length)return'';return `<div class="card"><h2>🚧 سقف الفئات</h2>${L.map(c=>{let sp=catSpent(c.id),p=sp/c.limit*100,col=p>=100?'#dc2626':p>=cfg.warn?'#f59e0b':'#14b8a6';return `<div style="margin:10px 0"><div class="row"><span>${esc(c.emoji+' '+c.name)}</span><span class="${p>=100?'red':'muted'}">${fmt(sp)} / ${fmt(c.limit)}</span></div><div class="bar"><i style="width:${Math.min(100,p)}%;background:${col}"></i></div>${p>=100?`<div class="red" style="font-size:13px">⛔ تجاوزت السقف بـ ${fmt(sp-c.limit)}</div>`:p>=cfg.warn?`<div style="font-size:13px;color:#d97706">⚠️ اقتربت من السقف (${Math.round(p)}٪)</div>`:''}</div>`}).join('')}</div>`}

function periodExp(k){return expenses.filter(e=>pKey(e.date)===k).sort((a,b)=>a.date<b.date?1:-1)}
function byCat(l){let o={};l.forEach(e=>o[e.category]=round((o[e.category]||0)+Number(e.amount)));return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function dl(n,t,x){let u=URL.createObjectURL(new Blob(['\ufeff'+x],{type:t})),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function exportXls(){const X=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),cl=v=>typeof v==='number'?`<Cell><Data ss:Type="Number">${v}</Data></Cell>`:`<Cell><Data ss:Type="String">${X(v)}</Data></Cell>`,sh=(n,h,r)=>`<Worksheet ss:Name="${n}"><Table><Row>${h.map(cl).join('')}</Row>${r.map(x=>`<Row>${x.map(cl).join('')}</Row>`).join('')}</Table><WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><DisplayRightToLeft/></WorksheetOptions></Worksheet>`,k=smo();let x='<?xml version="1.0" encoding="UTF-8"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+sh('المصاريف',['التاريخ','الفئة','المبلغ','الدفع','ملاحظة'],expenses.slice().sort((a,b)=>a.date<b.date?1:-1).map(e=>[e.date,cat(e.category).name,Number(e.amount),e.wallet==='cash'?'نقدية':'بنك',e.note||'']))+sh('الفئات '+k,['الفئة','المبلغ','السقف'],byCat(periodExp(k)).map(([c,v])=>[cat(c).name,v,cat(c).limit||0]))+sh('الديون',['الشخص','النوع','المبلغ','المسدد','المتبقي'],debts.map(d=>[d.person,d.type==='lend'?'لك':'عليك',Number(d.amount),paid(d),rem(d)]))+'</Workbook>';dl('masarifi-'+k+'.xls','application/vnd.ms-excel',x);msg('تم تصدير ملف Excel')}
function exportPdf(){let k=smo(),pe=periodExp(k),tb=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${esc(y)}</td>`).join('')}</tr>`).join('')}</table>`;document.querySelectorAll('#pa').forEach(x=>x.remove());let pa=document.createElement('div');pa.id='pa';pa.innerHTML=`<h1>📒 تقرير مصاريفي — ${esc(k)}</h1><p>الفترة: ${pRange(k)}<br>المجموع: <b>${esc(fmt(sum(pe)))}</b></p><h2>حسب الفئة</h2>${tb(['الفئة','المبلغ','السقف'],byCat(pe).map(([c,v])=>[cat(c).emoji+' '+cat(c).name,fmt(v),cat(c).limit>0?fmt(cat(c).limit):'—']))}<h2>المصاريف</h2>${tb(['التاريخ','الفئة','المبلغ','الدفع','ملاحظة'],pe.map(e=>[e.date,cat(e.category).name,fmt(e.amount),e.wallet==='cash'?'نقدية':'بنك',e.note||'']))}<h2>الديون</h2>${tb(['الشخص','النوع','المبلغ','المتبقي'],debts.map(d=>[d.person,d.type==='lend'?'لك':'عليك',fmt(d.amount),fmt(rem(d))]))}`;document.body.appendChild(pa);document.body.classList.add('printing');const done=()=>{pa.remove();document.body.classList.remove('printing');removeEventListener('afterprint',done)};addEventListener('afterprint',done);setTimeout(()=>print(),60)}

function backupView(){return `<div class="card"><h2>🎨 المظهر</h2><div class="field"><select id="theme"><option value="light"${cfg.theme==='light'?' selected':''}>فاتح</option><option value="dark"${cfg.theme==='dark'?' selected':''}>داكن</option><option value="auto"${cfg.theme==='auto'?' selected':''}>حسب النظام</option></select></div></div><div class="card"><h2>النسخ الاحتياطي</h2><button id="export">تصدير JSON</button> <button class="secondary" id="import">استيراد JSON</button><input id="file" type="file" accept=".json,application/json" hidden></div>`}
function bind(){let xp=document.querySelector('#xpdf');if(xp)xp.onclick=exportPdf;let xl=document.querySelector('#xls');if(xl)xl.onclick=exportXls;let th=document.querySelector('#theme');if(th)th.onchange=()=>{cfg.theme=th.value;save();render()};let sm=document.querySelector('#sm');if(sm)sm.onchange=()=>{statMonth=sm.value||'';render()};let cg=document.querySelector('#cfgf');if(cg)cg.onsubmit=e=>{e.preventDefault();let f=new FormData(cg);cfg.salary=Math.max(0,round(f.get('salary')));cfg.budget=Math.max(0,round(f.get('budget')));cfg.startDay=Math.min(31,Math.max(1,Math.round(Number(f.get('startDay'))||1)));cfg.warn=Math.min(100,Math.max(1,Math.round(Number(f.get('warn'))||80)));save();render();msg('تم الحفظ')};let ar=document.querySelector('#arf');if(ar)ar.onsubmit=e=>{e.preventDefault();let m=Math.max(1,Number(new FormData(ar).get('months'))||6),d=new Date();d.setMonth(d.getMonth()-m);let cut=d.toISOString().slice(0,10),n=0;expenses.forEach(x=>{if(!x.archived&&x.date<cut){x.archived=true;n++}});cfg.months=m;save();render();msg(n?'تمت أرشفة '+n+' مصروف':'لا توجد مصاريف أقدم')};let ua=document.querySelector('#unarch');if(ua)ua.onclick=()=>{expenses.forEach(x=>delete x.archived);save();render()};document.querySelectorAll('[data-editexp]').forEach(b=>b.onclick=()=>{editExp=b.dataset.editexp;render()});document.querySelectorAll('[data-cancelexp]').forEach(b=>b.onclick=()=>{editExp=null;render()});document.querySelectorAll('.eef').forEach(fm=>fm.onsubmit=e=>{e.preventDefault();let f=new FormData(fm),x=expenses.find(v=>v.id===fm.dataset.id),a=round(f.get('amount')),w=f.get('wallet');if(!x||a<=0)return msg('مبلغ غير صحيح');wallets[x.wallet]=round(wallets[x.wallet]+x.amount);if(wallets[w]<a){wallets[x.wallet]=round(wallets[x.wallet]-x.amount);return msg('الرصيد غير كاف')}wallets[w]=round(wallets[w]-a);Object.assign(x,{amount:a,wallet:w,category:f.get('category'),date:f.get('date'),note:f.get('note').trim()});editExp=null;save();render();msg('تم التعديل')});let ef=document.querySelector('#ef');if(ef)ef.onsubmit=e=>{e.preventDefault();let f=new FormData(ef),a=round(f.get('amount')),w=f.get('wallet');if(a<=0)return msg('مبلغ غير صحيح');if(wallets[w]<a)return msg('الرصيد غير كاف');wallets[w]=round(wallets[w]-a);expenses.push({id:id(),amount:a,wallet:w,category:f.get('category'),date:f.get('date'),note:f.get('note').trim()});save();render();msg(limitNote(f.get('category'))||'تم تسجيل المصروف')};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let x=expenses.find(e=>e.id===b.dataset.del);wallets[x.wallet]=round(wallets[x.wallet]+x.amount);expenses=expenses.filter(e=>e.id!==x.id);save();render()});let df=document.querySelector('#df');if(df)df.onsubmit=e=>{e.preventDefault();let f=new FormData(df),a=round(f.get('amount'));wallets[f.get('wallet')]=round(wallets[f.get('wallet')]+a);save();render()};let tf=document.querySelector('#tf');if(tf)tf.onsubmit=e=>{e.preventDefault();let f=new FormData(tf),a=round(f.get('amount')),from=f.get('from'),to=f.get('to');if(from===to||a<=0)return msg('تحقق من التحويل');if(wallets[from]<a)return msg('الرصيد غير كاف');wallets[from]=round(wallets[from]-a);wallets[to]=round(wallets[to]+a);save();render()};let wf=document.querySelector('#wf');if(wf)wf.onsubmit=e=>{e.preventDefault();let f=new FormData(wf),a=round(f.get('account')),c=round(f.get('cash'));if(a<0||c<0)return msg('مبلغ غير صحيح');wallets={account:a,cash:c};save();render();msg('تم تحديث الأرصدة')};let bf=document.querySelector('#bf');if(bf)bf.onsubmit=e=>{e.preventDefault();let f=new FormData(bf),a=round(f.get('amount')),type=f.get('type');if(a<=0)return msg('مبلغ غير صحيح');debts.push({id:id(),person:f.get('person').trim(),amount:a,type,payments:[]});save();render();msg('تمت إضافة الدين')};document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{payDebt=b.dataset.pay;render()});document.querySelectorAll('[data-cancelpay]').forEach(b=>b.onclick=()=>{payDebt=null;render()});document.querySelectorAll('.pf').forEach(fm=>fm.onsubmit=e=>{e.preventDefault();let f=new FormData(fm),d=debts.find(x=>x.id===fm.dataset.id),a=round(f.get('amount'));if(!d)return;if(a<=0)return msg('مبلغ غير صحيح');if(a>rem(d))return msg('المبلغ أكبر من المتبقي');d.payments.push({id:id(),amount:a,date:f.get('date')});payDebt=null;save();render();msg(rem(d)<=0?'تم تسديد الدين بالكامل':'تم تسجيل الدفعة')});document.querySelectorAll('[data-delpay]').forEach(b=>b.onclick=()=>{let d=debts.find(x=>x.id===b.dataset.debt);if(!d||!confirm('حذف هذه الدفعة؟'))return;d.payments=d.payments.filter(x=>x.id!==b.dataset.delpay);save();render()});document.querySelectorAll('[data-deldebt]').forEach(b=>b.onclick=()=>{if(!confirm('حذف هذا الدين نهائياً؟'))return;debts=debts.filter(x=>x.id!==b.dataset.deldebt);save();render()});let cf=document.querySelector('#cf');if(cf)cf.onsubmit=e=>{e.preventDefault();let f=new FormData(cf),n=f.get('name').trim();if(!n)return msg('أدخل اسماً');cats.push({id:id(),name:n,emoji:f.get('emoji').trim()||'✨',color:f.get('color'),limit:Math.max(0,round(f.get('limit')))});save();render();msg('تمت إضافة الفئة')};document.querySelectorAll('[data-editcat]').forEach(b=>b.onclick=()=>{editCat=b.dataset.editcat;render()});document.querySelectorAll('[data-cancelcat]').forEach(b=>b.onclick=()=>{editCat=null;render()});document.querySelectorAll('.ecf').forEach(fm=>fm.onsubmit=e=>{e.preventDefault();let f=new FormData(fm),c=cats.find(x=>x.id===fm.dataset.id),n=f.get('name').trim();if(!c)return;if(!n)return msg('أدخل اسماً');c.name=n;c.emoji=f.get('emoji').trim()||'✨';c.color=f.get('color');c.limit=Math.max(0,round(f.get('limit')));editCat=null;save();render();msg('تم تعديل الفئة')});document.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=()=>{if(cats.length<=1)return msg('يجب إبقاء فئة واحدة على الأقل');let c=cats.find(x=>x.id===b.dataset.delcat);if(!c||!confirm('حذف فئة «'+c.name+'»؟ ستظهر مصاريفها السابقة كغير مصنفة.'))return;cats=cats.filter(x=>x.id!==c.id);save();render()});let ex=document.querySelector('#export');if(ex)ex.onclick=()=>{let blob=new Blob([JSON.stringify({version:9,expenses,wallets,debts,cats,cfg})],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='masarifi-backup.json';a.click();URL.revokeObjectURL(u)};let im=document.querySelector('#import'),file=document.querySelector('#file');if(im)im.onclick=()=>file.click();if(file)file.onchange=async()=>{try{let d=JSON.parse(await file.files[0].text());if(!Array.isArray(d.expenses)||!Array.isArray(d.debts)||!(Array.isArray(d.cats)||Array.isArray(d.customCats))||!d.wallets||!['account','cash'].every(k=>Number.isFinite(Number(d.wallets[k])))||!d.expenses.every(x=>Number(x.amount)>0&&['account','cash'].includes(x.wallet))||!d.debts.every(x=>Number(x.amount)>0&&['lend','borrow'].includes(x.type)))throw 0;expenses=d.expenses;debts=d.debts.map(migr);let nc=Array.isArray(d.cats)?d.cats:defaults.concat(d.customCats);nc=nc.filter(c=>c&&c.id&&c.name&&c.emoji);cats=nc.length?nc:defaults.slice();if(d.cfg&&typeof d.cfg==='object')cfg=Object.assign(cfg,{salary:Math.max(0,round(d.cfg.salary)),budget:Math.max(0,round(d.cfg.budget)),months:Math.max(1,Number(d.cfg.months)||6),startDay:Math.min(31,Math.max(1,Number(d.cfg.startDay)||1)),warn:Math.min(100,Math.max(1,Number(d.cfg.warn)||80))});wallets={account:round(d.wallets.account),cash:round(d.wallets.cash)};save();render();msg('تم الاستيراد')}catch{msg('ملف غير صالح')}}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;editCat=null;payDebt=null;editExp=null;render()});document.querySelector('#settings').onclick=()=>{tab='backup';render()};render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
